<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dewy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* ============================================================
   DUEY DESIGN TOKENS
   One change here updates every component in the app.
   ============================================================ */
:root{
  color-scheme: light;

  /* palette: the nine approved colors, and nothing else */
  --powder-blue:#BCC7D4;   /* muted slate */
  --porcelain-ivory:#F5F1EA;
  --buttermilk:#EFE7D4;    /* warm stone */
  --dried-plum:#4A2E3A;    /* deep, quiet plum */
  --cherry-licorice:#8A4A4E; /* dusty wine */
  --milkshake-pink:#E9D5D1; /* dusty rose */
  --old-burgundy:#3A2C30;
  --olive-note:#B3B08E;
  --soft-silver:#DAD3CA;

  /* semantic roles */
  --surface-primary:var(--porcelain-ivory);
  --ink-primary:var(--dried-plum);
  --state-morning:var(--powder-blue);
  --state-evening:var(--old-burgundy);
  --action-current:var(--cherry-licorice);
  --cue-helpful:var(--buttermilk);
  --state-personal:var(--milkshake-pink);
  --state-exception:var(--olive-note);
  --structure-quiet:var(--soft-silver);
  /* roles the design system names but the palette already covers */
  --ink-secondary:var(--old-burgundy);        /* 10:1 on Porcelain Ivory */
  --state-selected:var(--dried-plum);
  --action-destructive:var(--cherry-licorice);

  /* ink on each field, measured against that field */
  --ink-on-evening:var(--porcelain-ivory);   /* 11.3:1 on Old Burgundy */
  --ink-on-evening-meta:var(--buttermilk);   /* 10.9:1 on Old Burgundy */
  --ink-on-morning:var(--dried-plum);        /*  5.7:1 on Powder Blue */
  --ink-on-personal:var(--dried-plum);       /*  7.4:1 on Milkshake Pink */

  /* container finishes, every value mixed from the palette above,
     so no generic grey ever enters the system */
  --finish-opaque:var(--soft-silver);
  --finish-frosted:#DDDBCB;   /* soft silver 55% + porcelain ivory 45% */
  --finish-clear:#EAE8D1;     /* soft silver 28% + porcelain ivory 72% */
  --finish-dark:#716461;      /* soft silver 35% + old burgundy 65% */
  --cap-light:#BDB1B1;        /* soft silver 88% + dried plum 12% */
  --cap-dark:#5E4E4B;         /* soft silver 20% + old burgundy 80% */
  --finish-used:#EFEDD3;      /* soft silver 18% + porcelain ivory 82% */

  /* type */
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;

  /* spacing, on an 8px rhythm */
  --s8:8px; --s16:16px; --s24:24px; --s32:32px; --s40:40px; --s48:48px; --s64:64px;

  /* geometry: the soft system Morgan chose from the concept renders */
  --radius:2px;
  --radius-chip:10px;
  --radius-card:20px;
  --radius-pill:999px;
  --surface-raised:#FBF9F5;   /* porcelain ivory lifted toward white */
  --plinth:#ECE5D8;           /* warm stone for product plinths */           /* buttermilk softened for product plinths */
  --shadow-card:0 2px 14px rgba(67,48,46,.10);
  --shadow-soft:0 1px 6px rgba(67,48,46,.08);
  --touch-min:44px;
  --action-height:52px;
  --rule:1px;
  --contour:2px;
  --contour-offset:5px;

  /* motion */
  --t-step:180ms;
  --t-fade:160ms;
  --t-enlarge:240ms;
  --t-complete:240ms;
  --t-press:100ms;
  --e-out:cubic-bezier(0,0,.2,1);
}

/* ============================================================
   TYPE STYLES
   ============================================================ */
/* Four sizes, all in the same voice. The old monospace, letter-spaced meta
   label read as a dashboard; labels are now quiet sans, never uppercase. */
.t-routine-heading{font-family:var(--sans);font-size:34px;line-height:38px;font-weight:500;margin:0;letter-spacing:-.015em}
.t-section-heading{font-family:var(--sans);font-size:19px;line-height:25px;font-weight:500;margin:0}
.t-body{font-family:var(--sans);font-size:16px;line-height:24px;font-weight:400;margin:0}
.t-caption{font-family:var(--sans);font-size:13px;line-height:18px;font-weight:400;margin:0}
.t-meta{font-family:var(--sans);font-size:13px;line-height:18px;font-weight:500;letter-spacing:0;margin:0}
.t-screen-title{font-family:var(--sans);font-size:48px;line-height:44px;font-weight:500;margin:0;letter-spacing:-.02em;text-wrap:balance}
.t-button{font-family:var(--sans);font-size:16px;line-height:20px;font-weight:600;letter-spacing:.01em}

/* ============================================================
   BASE
   ============================================================ */
html{height:100%;background:var(--surface-primary);color:var(--ink-primary)}
body{height:100%}
body{
  margin:0;
  background:var(--surface-primary);
  color:var(--ink-primary);
  font-family:var(--sans);
  font-size:15px;line-height:21px;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;border:none;background:none;padding:0;text-align:left}
button:active{opacity:.6;transition:opacity var(--t-press) linear}
:focus-visible{outline:var(--contour) solid var(--ink-primary);outline-offset:2px}
h1,h2,h3{margin:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.hidden{display:none !important}

/* the single scrolling region */
#view{padding-bottom:calc(var(--s64) + var(--s24) + env(safe-area-inset-bottom,0px))}

/* ============================================================
   HEADER FIELD
   Full-width rectangle, hard lower edge. Never rounded, never a card.
   ============================================================ */
.field{padding:var(--s16) var(--s16) var(--s16);border-radius:0;background:var(--surface-primary);
  color:var(--ink-primary);position:relative}
.field::before{content:"";position:absolute;top:0;left:0;right:0;height:6px}
.field[data-tod="pm"]::before{background:var(--state-evening)}
.field[data-tod="am"]::before{background:var(--state-morning)}
.brandbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s16)}
.topbrand{padding:var(--s16) var(--s16) 0;margin-bottom:0}
#opening{position:fixed;inset:0;z-index:50;background:var(--surface-primary);color:var(--ink-primary);
  display:flex;align-items:center;justify-content:center;pointer-events:none;
  opacity:1;transition:opacity 400ms var(--e-out)}
#opening[data-tod="pm"]{background:var(--state-evening);color:var(--porcelain-ivory)}
#opening.gone{opacity:0}
.opening-brand{font-size:34px;line-height:38px}
#zoom[hidden]{display:none}
#zoom{position:fixed;inset:0;z-index:70;background:var(--surface-primary);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--s16);padding:var(--s24);animation:fadein var(--t-enlarge) var(--e-out)}
#zoom .zcap{text-align:center}
#zoom .zclose{min-height:var(--touch-min);display:inline-flex;align-items:center;
  text-decoration:underline;text-underline-offset:3px;color:var(--ink-primary)}
.detailthumb{display:inline-flex;background:none;border:none;padding:0;cursor:pointer}
.searchwrap{position:relative}
.qclear{position:absolute;right:0;top:50%;transform:translateY(-50%);width:var(--touch-min);height:var(--touch-min);
  display:flex;align-items:center;justify-content:center;color:var(--ink-primary);opacity:.6;font-size:22px;line-height:1}
.searchrow{display:flex;gap:var(--s8);align-items:stretch}
.searchrow .searchwrap{flex:1;min-width:0}
.searchrow .btn-search{
  flex:0 0 auto;align-self:stretch;padding:0 var(--s16);
  background:var(--cherry-licorice);color:var(--porcelain-ivory);
  border:none;border-radius:var(--radius-chip);font:inherit;
  font-family:var(--sans);cursor:pointer;white-space:nowrap
}
.searchrow .btn-search:active{opacity:.9}
.results-head{margin:var(--s16) 0 var(--s8);opacity:.75}

.textrow.optrow{display:flex;align-items:center;gap:var(--s16);text-align:left;width:100%}
.textrow.optrow.isactive{outline:var(--contour) solid var(--ink-primary);outline-offset:-3px}
.optrow .rthumb{flex:0 0 auto;width:26px;display:flex;align-items:flex-end;justify-content:center}
.optrow .rtext{flex:1 1 auto;min-width:0}
.optrow .raddicon{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:24px;opacity:.55}
.brandname{font-family:var(--sans);font-size:24px;line-height:28px;font-weight:600;letter-spacing:-.01em;margin:0}
.brandbar button{display:flex;align-items:center;justify-content:center;width:var(--touch-min);height:var(--touch-min);color:var(--ink-primary)}
.icon{display:block}
.field-top{display:flex;justify-content:space-between;align-items:center;gap:var(--s16);flex-wrap:wrap;min-height:var(--touch-min)}
.greeting{opacity:.6}
.tod{display:flex;gap:var(--s16)}
.tod button{min-height:var(--touch-min);padding:0 2px;display:flex;align-items:center;border-bottom:var(--contour) solid transparent;opacity:.4;color:inherit}
.tod button[aria-pressed="true"]{opacity:1;border-bottom-color:currentColor}
.field-row{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s8) var(--s16);margin-top:var(--s16);flex-wrap:wrap}
.field-left{min-width:0;flex:1 1 60%}
.routine-type{margin-top:var(--s8)}
.field-meta{text-align:right;flex:0 1 auto;padding-bottom:2px;opacity:.7}
/* At large text the metadata stacks beneath the title rather than shrinking. */
@media (max-width:400px){
  .field-meta{text-align:left;flex:1 1 100%}
}

/* ============================================================
   MODE INDEX  (editorial index, not tabs)
   ============================================================ */
.modeline{padding:0 var(--s16) var(--s8)}
.modeline .row{display:flex;justify-content:space-between;align-items:center;gap:var(--s16);min-height:var(--touch-min)}
.modeline .change{flex:0 0 auto;min-height:var(--touch-min);display:flex;align-items:center;opacity:.7;
  text-decoration:underline;text-underline-offset:3px;color:var(--ink-primary)}
.modeopts{display:flex;flex-direction:column;animation:reveal var(--t-step) var(--e-out)}
.modeopts button{min-height:var(--touch-min);display:flex;align-items:center;color:var(--ink-primary);
  opacity:.6;border-bottom:var(--rule) solid var(--structure-quiet)}
.modeopts button:last-child{border-bottom:none}
.modeopts button[aria-pressed="true"]{opacity:1;font-weight:500}

.focus{background:var(--state-morning);color:var(--ink-primary);padding:12px var(--s16);
  border-radius:var(--radius-card);box-shadow:var(--shadow-soft);width:calc(100% - 2*var(--s16));box-sizing:border-box;
  display:flex;align-items:center;gap:12px;margin:0 var(--s16) var(--s8);text-align:left}
.focus .fbody{flex:1 1 auto;min-width:0}
.focus .line{display:block;margin-top:2px}
.focus .chev{flex:0 0 auto;opacity:.6;transition:transform var(--t-step) var(--e-out)}
.focus[aria-expanded="true"] .chev{transform:rotate(90deg)}
.focuspanel{background:var(--surface-raised);border-radius:var(--radius-card);box-shadow:var(--shadow-soft);
  padding:var(--s16);margin:0 var(--s16) var(--s8)}
.focuspanel .line{margin-top:2px}
.focuspanel .quiet-row{justify-content:flex-start;margin-top:var(--s8)}
.routine-state{display:flex;justify-content:space-between;align-items:center;gap:var(--s16);flex-wrap:wrap;
  padding:var(--s8) var(--s16);border-bottom:var(--rule) solid var(--structure-quiet)}
.routine-state .back{min-height:var(--touch-min);display:flex;align-items:center;text-decoration:underline;text-underline-offset:3px}

/* ============================================================
   SKIN STATE
   ============================================================ */
.skin{padding:0 var(--s16);border-bottom:var(--rule) solid var(--structure-quiet)}
.skin-q{min-height:var(--touch-min);display:flex;align-items:center;text-decoration:underline;text-underline-offset:3px;color:var(--ink-primary)}
.skin-opts{padding-bottom:var(--s8)}
.skin-opts{display:flex;flex-wrap:wrap;gap:0 var(--s16)}
.skin-opts button{min-height:var(--touch-min);display:flex;align-items:center;color:var(--ink-primary);opacity:.6;border-bottom:var(--contour) solid transparent}
.skin-opts button[aria-pressed="true"]{opacity:1;border-bottom-color:var(--ink-primary)}
.skin-status{background:var(--state-personal);color:var(--ink-on-personal);padding:var(--s8) var(--s16);border-radius:var(--radius-card);box-shadow:var(--shadow-soft);margin:var(--s8) 0}
.skin-status .row{display:flex;justify-content:space-between;align-items:center;gap:var(--s16);min-height:var(--touch-min)}
.skin-status .change{min-height:var(--touch-min);display:flex;align-items:center;text-decoration:underline;text-underline-offset:3px;color:var(--ink-on-personal)}
.skin-status .line{margin-top:2px}
.skin-status .care{margin-top:var(--s8);opacity:.85}

/* ============================================================
   SHELF
   ============================================================ */
/* A vanity ledge, not a furniture skin: light falls from above, and the only
   things with weight on this surface are the products themselves. */
.shelf-area{min-height:26vh;display:flex;flex-direction:column;justify-content:flex-end;
  padding-top:var(--s32);padding-bottom:var(--s8);
  background:linear-gradient(180deg,var(--surface-raised) 0%,#FBF8DE 62%,#F6F2CF 100%)}
.shelf-scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.shelf-scroll::-webkit-scrollbar{display:none}
.shelf{display:flex;align-items:flex-end;gap:var(--s24);padding:0 var(--s16);width:max-content;min-width:100%}
.shelf.wide{padding-right:var(--s8)}   /* crops the next object: the only scroll cue */
.obj{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;min-width:var(--touch-min);
     opacity:1;transition:opacity var(--t-fade) linear}
.obj.set-aside{opacity:.45}
.figure{display:flex;align-items:flex-end;justify-content:center;padding:var(--contour-offset);
        border:var(--contour) solid transparent;border-radius:0;
        transition:transform var(--t-enlarge) var(--e-out)}
/* The current object sits lifted and slightly nearer, as though it has been
   taken off the shelf — weight and distance, not a coloured box around it.
   A held position, not an animation: nothing pulses and nothing returns.
   The name printed under it carries the same message without motion. */
.obj.current .figure{transform:translateY(-14px) scale(1.06)}
/* Lifted objects cast a wider, softer, fainter shadow. Finished ones settle
   back down and lose their weight. */
.obj.current .obj-shadow{left:4%;right:4%;height:10px;background:rgba(67,48,46,.13);filter:blur(6px)}
.obj.done .figure,.obj.skipped .figure{transform:scale(.94) translateY(2px)}
.obj.done .obj-shadow,.obj.skipped .obj-shadow{left:18%;right:18%;height:5px;background:rgba(67,48,46,.10);filter:blur(2px)}
.obj.done svg rect{fill:var(--finish-used)}
.obj.done svg text{fill:var(--ink-primary);opacity:.3}
.obj:active .figure{transform:scale(.97);transition-duration:var(--t-press)}
.obj.current:active .figure{transform:translateY(-14px) scale(1.03);transition-duration:var(--t-press)}
.obj svg{display:block}
.obj img.pphoto,.thumb img.pphoto,.detailthumb img.pphoto{display:block;object-fit:contain}
.obj.done img.pphoto{filter:grayscale(.4) brightness(1.22) contrast(.78);opacity:.45}
.under .status{letter-spacing:.08em}
.under.set-aside .status{opacity:.8}
.baseline{height:10px;margin-top:0;
  background:linear-gradient(180deg,#FFFFFF 0%,#F2EEC9 38%,#E4DFB8 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 6px 14px rgba(67,48,46,.13)}
.obj-shadow{position:absolute;left:12%;right:12%;bottom:2px;height:7px;border-radius:50%;
  background:rgba(67,48,46,.16);filter:blur(3px)}
.figure{position:relative}
.undershelf{display:flex;align-items:flex-start;gap:var(--s24);padding:var(--s8) var(--s16) 0;width:max-content;min-width:100%}
.undershelf.wide{padding-right:var(--s8)}
.under{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.under .status{opacity:.55}
.under.set-aside .status{opacity:1;border-bottom:var(--contour) solid var(--state-exception);padding-bottom:2px}

/* ============================================================
   SET ASIDE NOTE
   ============================================================ */
.setaside{border-top:var(--rule) solid var(--structure-quiet);margin:var(--s24) var(--s16) 0;padding-top:var(--s16)}
.setaside .label{margin-bottom:var(--s8)}
.linkish{min-height:var(--touch-min);display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:3px;color:var(--ink-primary)}
.disclosure{border-top:var(--rule) solid var(--structure-quiet);margin-top:var(--s16);padding-top:var(--s16);
  animation:reveal var(--t-step) var(--e-out)}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ============================================================
   INSTRUCTION PANEL AND ACTIONS
   ============================================================ */
.panel{padding:var(--s24) var(--s16) 0}
.panel .eyebrow{margin-bottom:var(--s8)}
.panel .pname{margin-bottom:var(--s8)}
.panel .line{margin-top:2px}
.panel .why{opacity:.7;margin-top:var(--s8)}
.panel .expl{margin-top:var(--s8);opacity:.8}
.actions{padding:var(--s16) var(--s16) 0;display:flex;flex-direction:column;gap:var(--s8)}
.btn{height:var(--action-height);display:flex;align-items:center;justify-content:center;gap:10px;
     border-radius:var(--radius-pill);box-shadow:var(--shadow-soft);
     font-family:var(--sans);font-size:16px;line-height:20px;font-weight:600;letter-spacing:.01em;width:100%}
.btn-begin{background:var(--action-current);color:var(--surface-primary)}
.btn-done{background:none;color:var(--ink-primary);border:var(--contour) solid var(--ink-primary)}
.quiet-row{display:flex;flex-wrap:wrap;gap:0 var(--s24);justify-content:center}
.complete-state{padding:var(--s32) var(--s16) 0;animation:fadein var(--t-complete) var(--e-out)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.complete-state .line{margin-top:var(--s8)}
.complete-state .t-routine-heading{margin-bottom:var(--s8)}
.weekcard{background:var(--surface-raised);border-radius:var(--radius-card);box-shadow:var(--shadow-soft);
  padding:var(--s16);margin:var(--s16) var(--s16) 0}
.weekcard .line{margin-top:2px}
.memorycard{background:var(--state-personal);color:var(--ink-primary);border-radius:var(--radius-card);
  box-shadow:var(--shadow-soft);display:flex;align-items:center;gap:10px;
  padding:var(--s8) var(--s16);margin:var(--s16) var(--s16) 0}
.memorycard .avatar{flex:0 0 auto;display:flex}
.memorycard .mbody{flex:1 1 auto;text-align:left;min-height:var(--touch-min);display:flex;align-items:center;color:inherit}
.memorycard>.icon{opacity:.6}
.complete-state .count{margin-top:var(--s24)}

/* ============================================================
   CONFIRMATIONS AND DEFENSIVE STATES
   ============================================================ */
.confirm{border-top:var(--rule) solid var(--structure-quiet);margin:var(--s24) var(--s16) 0;padding-top:var(--s16)}
.confirm .line{margin-top:var(--s8)}
.confirm .row{display:flex;gap:var(--s24);margin-top:var(--s8);flex-wrap:wrap}
.confirm .row button{min-height:var(--touch-min);display:flex;align-items:center;padding:0 var(--s8);font-family:var(--sans);font-size:13px;line-height:18px;font-weight:500;letter-spacing:.1em}
.confirm .row .secondary{opacity:.6}
.notice{border-top:var(--rule) solid var(--structure-quiet);margin:var(--s24) var(--s16) 0;padding-top:var(--s16)}
.notice .line{margin-top:var(--s8)}

/* ============================================================
   GENERIC SECTIONS
   ============================================================ */
.page{padding:var(--s16) var(--margin)}
.page-head{padding:var(--s16) var(--s16) var(--s8)}
.rowlist{display:flex;flex-direction:column}
.rowitem{display:flex;gap:var(--s16);align-items:flex-end;width:100%;
  padding:var(--s16) var(--s16);border-bottom:var(--rule) solid var(--structure-quiet);min-height:var(--touch-min)}
.rowitem .thumb{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;width:52px}
.rowitem .meta{flex:1 1 auto;min-width:0}
.rowitem .brand{opacity:.7}
.rowitem .nm{margin-top:2px}
.rowitem .tags{margin-top:6px;opacity:.7}
.rowchips{display:block;margin-top:8px}
.tchip{display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-pill);
  padding:4px 10px;font-family:var(--sans);font-size:12px;line-height:16px}
.tchip .dot{width:6px;height:6px;border-radius:50%;background:var(--action-current)}
.tchip.now{background:var(--state-personal)}
.tchip.time{background:var(--state-morning)}
.tchip.occ{background:var(--surface-raised);box-shadow:var(--shadow-soft)}
.textrow .needs,.selrow .needs{display:block;opacity:.6;margin-top:2px;text-decoration:none}
.textrow{display:flex;align-items:center;min-height:var(--touch-min);padding:var(--s8) var(--s16);
  border-bottom:var(--rule) solid var(--structure-quiet);width:100%;text-decoration:underline;text-underline-offset:3px}
.selrow{display:flex;justify-content:space-between;align-items:center;gap:var(--s16);min-height:var(--touch-min);
  padding:var(--s8) var(--s16);border-bottom:var(--rule) solid var(--structure-quiet);width:100%}
.selrow .box{flex:0 0 auto;width:18px;height:18px;border:var(--rule) solid var(--ink-primary);border-radius:0}
.selrow[aria-pressed="true"] .box{background:var(--ink-primary)}
.selrow[aria-pressed="true"]{font-weight:500}
.field-label{display:block;margin-bottom:var(--s8)}
.input{width:100%;box-sizing:border-box;min-height:var(--touch-min);padding:var(--s8);
  border:var(--rule) solid var(--ink-primary);border-radius:0;background:var(--surface-primary);color:var(--ink-primary)}
.stack{display:flex;flex-direction:column;gap:var(--s16)}
/* ============================================================
   CABINET GALLERY
   A soft vertical gallery of the objects someone owns, grouped by what
   each one is for. Not shelves, not a dense catalogue: one calm column of
   sections, each an adaptive grid that gives every object room to be seen.
   ============================================================ */
.cabsection{padding:var(--s24) var(--s16) 0}
.cabsection .cabhead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s16);margin-bottom:var(--s8)}
.cabsection .cabcount{opacity:.55}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s24) var(--s16)}
.gcard{display:flex;flex-direction:column;width:100%;background:var(--surface-raised);border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);color:var(--ink-primary)}
.gcard .gmain{display:flex;flex-direction:column;align-items:flex-start;gap:10px;width:100%;padding:12px 12px 4px;
  color:inherit;font:inherit;font-family:var(--sans);text-align:left;border-radius:var(--radius-card) var(--radius-card) 0 0}
.gcard .gmain:active{opacity:.92}
.gcard .gmore{min-height:var(--touch-min);display:flex;align-items:center;padding:0 12px 6px;color:var(--ink-primary);
  opacity:.7;text-decoration:underline;text-underline-offset:3px}
.gcard .gmore[aria-expanded="true"]{opacity:1}
/* The action panel for one product spans the grid row beneath its card. */
.gmenu{grid-column:1/-1;background:var(--surface-raised);border-radius:var(--radius-card);box-shadow:var(--shadow-soft);
  padding:var(--s8) var(--s16) var(--s16)}
.gmenu .rowlist .textrow{padding-left:0;padding-right:0}
.catrow{display:flex;flex-wrap:wrap;gap:var(--s8);margin-top:var(--s8)}
.catrow button{min-height:var(--touch-min);padding:0 12px;border-radius:var(--radius-pill);
  border:var(--rule) solid var(--ink-primary);color:var(--ink-primary)}
.catrow button[aria-pressed="true"]{background:var(--ink-primary);color:var(--surface-primary)}
.cabfilters{display:flex;flex-wrap:wrap;gap:var(--s8);padding:0 var(--s16) var(--s8)}
.cabfilters button{min-height:var(--touch-min);padding:0 12px;border-radius:var(--radius-pill);
  border:var(--rule) solid var(--structure-quiet);color:var(--ink-primary)}
.cabfilters button[aria-pressed="true"]{border-color:var(--ink-primary);background:var(--ink-primary);color:var(--surface-primary)}
/* Empty states: an original container silhouette, one line, one action. */
.empty{padding:var(--s32) var(--s16);text-align:center}
.empty .eglyph{display:flex;justify-content:center;margin-bottom:var(--s16);opacity:.7}
.empty .btn{margin-top:var(--s16);width:auto;display:inline-flex;padding:0 var(--s24)}
/* Small reusable pieces the screens share. New surfaces use these rather
   than inventing another card. */
.card{background:var(--surface-raised);border-radius:var(--radius-card);box-shadow:var(--shadow-soft);padding:var(--s16)}
.btn-destructive{background:none;color:var(--action-destructive);border:var(--contour) solid var(--action-destructive)}
.btn[aria-disabled="true"]{opacity:.5}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s16);padding:var(--s24) var(--s16) var(--s8)}
.section-head .count{opacity:.55}
.caution{margin:0 var(--margin) var(--s8);padding:var(--s8) var(--s16);background:var(--cue-helpful);border-radius:var(--radius-card)}
/* Edit Routine and the step inspector: structured, buttons only. */
.editroutine{margin:var(--s16) var(--s16) 0;padding:var(--s16);background:var(--surface-raised);border-radius:var(--radius-card);box-shadow:var(--shadow-soft)}
.erow{display:flex;flex-direction:column;gap:6px;padding:var(--s8) 0;border-bottom:var(--rule) solid var(--structure-quiet)}
.erbtns{display:flex;flex-wrap:wrap;gap:var(--s8)}
.erbtns button{min-height:var(--touch-min);padding:0 12px;border-radius:var(--radius-pill);border:var(--rule) solid var(--ink-primary);color:var(--ink-primary)}
.erbtns button[disabled]{opacity:.35;cursor:default}
.steplist{list-style:none;margin:0;padding:0 var(--margin)}
.steplist li{display:flex;justify-content:space-between;gap:var(--s16);padding:var(--s8) 0;border-bottom:var(--rule) solid var(--structure-quiet)}
.confirm .row button{letter-spacing:0;font-weight:500}
/* Validation is words next to the field, never a red border alone. */
.field-error{margin-top:6px;padding-left:12px;border-left:var(--contour) solid var(--ink-primary)}
label.btn{cursor:pointer}
input.sr-only:focus-visible+label.btn{outline:var(--contour) solid var(--ink-primary);outline-offset:2px}
.tchip .tglyph{display:inline-flex;margin-right:4px}
.gcard .gvisual{width:100%;height:170px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.gcard .gvisual svg,.gcard .gvisual img{max-height:170px;width:auto;object-fit:contain}
.gcard .gname{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
.gcard .gbrand{opacity:.6;display:block}
.gcard .gcat{opacity:.6}
/* Category and state are always words, never colour alone. */
.gcard .gstate{opacity:.75;display:block;margin-top:2px}
.cabtoggle{display:flex;gap:var(--s16);align-items:center;padding:0 var(--s16)}
.cabtoggle button{min-height:var(--touch-min);display:flex;align-items:center;color:var(--ink-primary);
  opacity:.55;border-bottom:var(--contour) solid transparent}
.cabtoggle button[aria-pressed="true"]{opacity:1;font-weight:500;border-bottom-color:var(--ink-primary)}

/* The answer is a passage of writing, not a message from a bot. */
.answer{display:block;margin:var(--s8) var(--s16) 0;max-width:38em}
.answer .card{border-left:var(--contour) solid var(--structure-quiet);padding-left:var(--s16)}
.answer .card{background:var(--surface-raised);border-radius:var(--radius-card);border-top-left-radius:6px;
  padding:var(--s16);box-shadow:var(--shadow-soft)}
.chiprow{display:flex;flex-wrap:wrap;gap:var(--s8);padding:var(--s16)}
.chip{background:var(--state-morning);color:var(--ink-primary);border-radius:var(--radius-pill);
  padding:10px 14px;min-height:var(--touch-min);display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink-primary);color:var(--surface-primary)}
.chip.quiet{background:var(--surface-raised);box-shadow:var(--shadow-soft)}
.answer .expl{margin-top:var(--s8)}
.answer .rec{margin-top:var(--s16)}
.answer .src{margin-top:var(--s16);opacity:.65}
.entry{padding:var(--s16);border-bottom:var(--rule) solid var(--structure-quiet)}
.entry.memory{background:var(--state-personal)}
.entry .obs{margin-top:var(--s8)}
.entry .note{margin-top:var(--s8);opacity:.8}

/* ============================================================
   BOTTOM NAVIGATION
   ============================================================ */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--state-morning);
  border-top:var(--rule) solid var(--structure-quiet);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.nav{border-radius:var(--radius-card) var(--radius-card) 0 0;box-shadow:0 -2px 14px rgba(67,48,46,.10)}
.nav button{flex:1 1 0;min-width:0;min-height:var(--touch-min);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:10px 2px calc(10px);color:var(--ink-primary);opacity:.55;text-align:center}
.nav button[aria-current="page"]{opacity:1;font-weight:600}

/* ============================================================
   FOOTER
   ============================================================ */
footer{padding:var(--s40) var(--margin) var(--s32);display:flex;flex-direction:column;gap:var(--s8)}
footer p{opacity:.65;max-width:38em}

/* ============================================================
   MOTION REDUCTION
   Movement becomes an instant state change. Feedback is never removed.
   ============================================================ */

/* Home */
.home-hero{padding:var(--s24) var(--s16) var(--s8)}
.home-hero .t-routine-heading{margin:0 0 var(--s8)}
.home-actions{padding:0 var(--s16) var(--s32);display:flex;flex-direction:column;gap:var(--s8)}
.homecard{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s16);
  width:100%;text-align:left;padding:var(--s16) var(--s16);
  background:var(--finish-clear);border:none;border-radius:var(--radius-card);
  color:var(--ink-primary);cursor:pointer;font:inherit;font-family:var(--sans)
}
.homecard:active{opacity:.92}
.homecard .hc-label{display:block;font-family:var(--sans);font-size:13px;line-height:18px;font-weight:500;letter-spacing:0;opacity:.62;margin:0 0 2px}
.homecard .hc-title{display:block;font-size:18px;line-height:24px;font-weight:500;margin:0}
.homecard .hc-sub{display:block;margin-top:4px;opacity:.7;font-size:14px;line-height:20px}
.homecard.primary{background:var(--cherry-licorice);color:var(--porcelain-ivory)}
.homecard.primary .hc-label,.homecard.primary .hc-sub{opacity:.85;color:var(--porcelain-ivory)}
.brandname-btn{background:none;border:none;padding:0;cursor:pointer;color:inherit;font:inherit}
.brandname-btn .brandname{pointer-events:none}
.tod-switch{display:flex;gap:var(--s16);align-items:center}
/* Discover is the one editorial surface: an offset lead line is the only
   asymmetry, and it stays legible at every width. */
.disc-hero{padding:var(--s32) var(--s16) var(--s16)}
.disc-hero .t-routine-heading{margin-top:var(--s8);max-width:12em}
.disc-lead{margin:var(--s16) 0 0 18%;max-width:22em;opacity:.8}
.disc-guide{padding-top:var(--s24)}
@media (max-width:360px){.disc-lead{margin-left:0}}

/* ============================================================
   TACTILE CARD STACK
   One object in the hand, the next beneath it. Everything that moves
   during a gesture is a transform or an opacity; nothing here reads
   layout inside a frame. Geometry is measured once, on touch-down.
   ============================================================ */
:root{
  --stack-press:.985;          /* touch-down compression */
  --stack-lift:1.025;          /* the card lifts into the hand */
  --stack-parallax:14px;       /* how far the next card sits back */
  --elev-rest:0 2px 6px rgba(67,48,46,.10);
  --elev-lift:0 18px 34px rgba(67,48,46,.20);
}
.stack{position:relative;margin:var(--s16) var(--s16) 0;user-select:none;-webkit-user-select:none}
.stack-hero{position:relative;z-index:2;background:var(--surface-raised);border-radius:var(--radius-card);box-shadow:var(--elev-rest);
  padding:var(--s16);will-change:transform;touch-action:none;cursor:grab;
  transition:transform 90ms var(--e-out),box-shadow 120ms var(--e-out)}
.stack-hero:focus-visible{outline:var(--contour) solid var(--ink-primary);outline-offset:4px}
.stack-hero.pressed{transform:scale(var(--stack-press))}
.stack-hero.dragging{transition:none;box-shadow:var(--elev-lift);cursor:grabbing}
.stack-next{position:absolute;left:4%;right:4%;top:0;bottom:0;z-index:1;background:var(--finish-clear);border-radius:var(--radius-card);
  transform:translateY(var(--stack-parallax)) scale(.94);opacity:.7;padding:var(--s16);overflow:hidden;color:var(--ink-primary);will-change:transform}
/* The destinations a horizontal drag can reach: named, visible, and real state. */
.stack-rail{position:absolute;top:50%;transform:translateY(-50%);z-index:0;opacity:0;transition:opacity 120ms linear,transform 120ms var(--e-out);
  padding:10px 14px;border-radius:var(--radius-pill);font-family:var(--sans);font-size:13px;line-height:18px;font-weight:500}
.stack-rail.right{right:0;background:var(--state-personal);color:var(--ink-on-personal)}
.stack-rail.left{left:0;background:var(--surface-raised);box-shadow:var(--shadow-soft);color:var(--ink-primary)}
.stack-rail.ready{opacity:1!important}
.stack-rail.armed{transform:translateY(-50%) scale(1.06)}
.stack-hero.enter{animation:stackenter var(--t-enlarge) var(--e-out)}
@keyframes stackenter{from{transform:translateY(var(--stack-parallax)) scale(.96);opacity:.6}to{transform:none;opacity:1}}
.stack-undo{display:flex;justify-content:space-between;align-items:center;gap:var(--s16);margin:0 0 var(--s8);
  padding:var(--s8) var(--s16);background:var(--cue-helpful);border-radius:var(--radius-pill);min-height:var(--touch-min)}
.stack-hint{opacity:.6;margin:var(--s8) var(--s16) 0}
@media (prefers-reduced-motion:reduce){
  .stack-hero.enter{animation:none}
  .stack-hero.pressed{transform:none;opacity:.85}
  .stack-hero{transition:opacity 120ms linear}
  .stack-next{transform:none}
}

/* ============================================================
   EDITORIAL GRID  (Morgan · 2026-09-23)
   One left margin, three 80px columns with 16px gutters, an 8px baseline.
   Every screen hangs from the same edge. Borrowed bones, Dewy colours.
   ============================================================ */
:root{--margin:24px;--col:80px;--gutter:16px;--content:272px}
.m{padding-left:var(--margin);padding-right:var(--margin)}
.t-eyebrow{font-family:var(--sans);font-size:11px;line-height:16px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--dried-plum);margin:0}
.t-display{font-family:var(--sans);font-size:56px;line-height:48px;font-weight:500;letter-spacing:-.02em;margin:0;white-space:nowrap}
.t-foot{font-family:var(--sans);font-size:40px;line-height:40px;font-weight:500;letter-spacing:-.02em;margin:0;color:var(--dried-plum)}
/* the hairline nav: three cells, wordmark truly centred */
.topnav{display:grid;grid-template-columns:var(--col) 1fr var(--col);align-items:center;height:56px;
  margin:0 var(--margin);border-bottom:var(--rule) solid var(--structure-quiet)}
.topnav .brandname-btn{justify-self:center}
.topnav .brandname{font-size:13px;line-height:16px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--dried-plum)}
.topnav .navlink{min-height:var(--touch-min);display:inline-flex;align-items:center;color:var(--ink-primary);font-family:var(--sans);font-size:13px;line-height:16px}
.topnav .navlink.r{justify-self:end}
/* Home hero: one product, the greeting split across the image's lower edge */
.hero{position:relative;height:296px;background:var(--state-personal);overflow:visible;margin-bottom:var(--s64)}
.hero .hero-wash{position:absolute;inset:0;background:#DEC4C0;clip-path:polygon(0 0,100% 0,100% 58%,0 72%)}
.hero .hero-photo{position:absolute;left:0;right:0;top:88px;bottom:48px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.hero .hero-photo svg,.hero .hero-photo img{max-height:160px;width:auto}
.hero .hero-kicker{position:absolute;left:var(--margin);top:32px;color:var(--dried-plum)}
.hero .hero-l1{position:absolute;left:var(--margin);top:256px;color:var(--porcelain-ivory)}
.hero .hero-l2{position:absolute;left:var(--margin);top:304px;color:var(--dried-plum)}
.hero-eyebrow{margin:var(--s16) var(--margin) 0}
/* plinths: three to a row, on the columns, object standing on the bottom edge */
.plinths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gutter);margin:var(--s8) var(--margin) 0}
.plinth{display:flex;flex-direction:column;align-items:stretch;gap:var(--s8);color:var(--ink-primary);text-align:left;width:100%}
.plinth .pv{height:96px;background:var(--plinth);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;overflow:hidden}
.plinth .pv svg,.plinth .pv img{max-height:80px;width:auto}
.plinth .pn{font-size:12px;line-height:16px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plinth .pf{font-size:12px;line-height:16px;opacity:.65;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plinth.blank .pv{background:var(--finish-clear)}
/* the bottom rule shared by every screen */
.foot-line{display:flex;justify-content:space-between;align-items:center;gap:var(--s16);margin:var(--s24) var(--margin) 0;
  padding-top:var(--s8);border-top:var(--rule) solid var(--structure-quiet);font-size:12px;line-height:16px;opacity:.85}
.foot-line span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot-line button{min-height:var(--touch-min);display:inline-flex;align-items:center;color:var(--ink-primary);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.foot-word{margin:var(--s48) var(--margin) var(--s24)}
/* Home actions become quiet rows on the margin */
.home-actions{padding:var(--s24) var(--margin) 0;gap:0}
.homecard{background:none;border-radius:0;padding:var(--s16) 0;border-bottom:var(--rule) solid var(--structure-quiet)}
.homecard.primary{background:none;color:var(--ink-primary)}
.homecard.primary .hc-label,.homecard.primary .hc-sub{color:var(--ink-primary);opacity:.62}
.homecard .hc-title{font-size:16px;line-height:24px}
/* Cabinet gallery: Buttermilk plinths on the three columns, no cards */
.cabsection{padding:var(--s24) var(--margin) 0}
.cabsection .cabhead{margin-bottom:var(--s16)}
.cabsection .t-section-heading{font-size:13px;line-height:16px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.gallery{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s24) var(--gutter)}
.gcard{background:none;border-radius:0;box-shadow:none}
.gcard .gmain{padding:0;gap:var(--s8);border-radius:0}
.gcard .gvisual{height:96px;background:var(--plinth);align-items:flex-end;padding-bottom:8px;box-sizing:border-box}
.gcard .gvisual svg,.gcard .gvisual img{max-height:80px}
.gcard .gbrand{font-size:12px;line-height:16px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gcard .gname{font-size:12px;line-height:16px;-webkit-line-clamp:2}
.gcard .gcat{display:none}
.gcard .gstate{margin-top:0}
.gcard .gstate .tchip{padding:0;background:none;box-shadow:none;font-size:11px;line-height:16px;opacity:.75}
.gcard .gmore{padding:0;min-height:32px;font-size:11px;line-height:16px}
.gmenu{border-radius:0;box-shadow:none;background:var(--finish-clear);padding:var(--s16)}
.cabfilters,.cabtoggle{padding-left:var(--margin);padding-right:var(--margin)}
.page-head{padding:var(--s16) var(--margin) var(--s8)}
.page-head .t-screen-title{margin-top:var(--s8);margin-bottom:var(--s8)}
.cabinet-eyebrow{margin:var(--s24) var(--margin) 0}
/* the lifted product and its label card */
.lifted{margin:var(--s16) var(--margin) 0;height:240px;background:var(--surface-raised);display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:var(--s16);box-sizing:border-box;box-shadow:0 26px 48px -16px rgba(67,48,46,.40);animation:liftin var(--t-enlarge) var(--e-out)}
@keyframes liftin{from{transform:translateY(12px);box-shadow:none}to{transform:none}}
.lifted .detailthumb svg,.lifted .detailthumb img{max-height:200px;width:auto}
.lifted-name{margin:var(--s24) var(--margin) 0}
.lifted-fact{margin:0 var(--margin);opacity:.7}
.thread{width:2px;height:16px;background:var(--structure-quiet);margin:var(--s16) 0 0 calc(var(--margin) + (100% - 2*var(--margin) - var(--col) - var(--gutter))/2 - 1px)}
.tag{margin:0 var(--margin);width:calc(100% - 2*var(--margin) - var(--col) - var(--gutter));box-sizing:border-box;background:var(--surface-raised);padding:12px 14px;
  font-family:var(--mono);font-size:11px;line-height:16px;box-shadow:0 14px 30px -14px rgba(67,48,46,.35);
  transform-origin:50% 0;animation:tagin 480ms var(--e-out)}
@keyframes tagin{from{opacity:0;transform:rotateX(-70deg)}to{opacity:1;transform:none}}
.tag .tb{font-family:var(--sans);font-weight:500;letter-spacing:.18em;text-transform:uppercase;text-align:center;
  padding-bottom:8px;margin-bottom:8px;border-bottom:var(--rule) solid var(--structure-quiet);color:var(--dried-plum)}
.tag .tr{display:flex;justify-content:space-between;gap:var(--s8);color:var(--ink-primary);text-decoration:none;min-height:16px}
.tag .tr .k{opacity:.55;letter-spacing:.06em}
.tag .tr .v{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag a.tr .v{text-decoration:underline;text-underline-offset:3px}
.tag .btn{margin-top:12px;min-height:32px;height:32px;font-size:12px;line-height:32px;padding:0;border-radius:var(--radius-pill)}
.tag .tnote{margin-top:8px;opacity:.65;font-family:var(--sans)}
.field{padding-left:var(--margin);padding-right:var(--margin)}
.field .topnav{margin:0 0 var(--s16)}
@media (prefers-reduced-motion:reduce){.lifted,.tag{animation:none}}
/* every screen: lists, notices, and states hang from the margin; no cards */
.rowlist{margin:0 var(--margin)}
.searchrow .btn-search{background:var(--ink-primary);color:var(--porcelain-ivory);border-radius:var(--radius-pill);font-weight:500}
/* Routine: title like every other screen, product on a plinth, one plum action */
.routine-title{margin:var(--s8) 0 var(--s8)}
.field .field-top{margin-top:var(--s16)}
.tod button{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.4;border-bottom-width:1px}
.tod button[aria-pressed="true"]{opacity:1}
.steprows{margin-top:var(--s16)}
.steprow{grid-template-columns:64px minmax(0,1fr) 22px;min-height:88px}
.steprow .sw{width:64px;height:64px;padding-bottom:8px}
.steprow .sw svg,.steprow .sw img{max-height:48px}
.steprow .nm{font-size:15px;line-height:20px}
.btn-begin{background:var(--ink-primary);color:var(--porcelain-ivory);box-shadow:none;height:56px;font-size:16px;font-weight:500}
.actions{padding-top:var(--s32)}
.actions .nextup{margin-top:var(--s16)!important;opacity:.6!important}
.actions .quiet-row{margin-top:var(--s8)}
.focus{padding-top:var(--s32)}

/* What you do survives a reload. Stored only in this browser, never sent
   anywhere. Every access is guarded: private windows and blocked site data
   throw, and the app must still work with nothing stored. */
var STORE='dewy.v3',STORE_PREV='dewy.v2';   /* v3 adds routine lists and user photos; v2 is read, never deleted */
var SAVED_PRODUCT_FIELDS=['brand','productName','kind','category','confidence','confidenceReason','catalogId',
  'status','morningEligible','eveningEligible','occasional','lastUpdated','dateAdded','notes','routineHistory',
  'directionsSource','directionsVerified','directionsVerifiedAt','directionsConflict'];
function save(){
  try{
    var prod={};
    Object.keys(PRODUCTS).forEach(function(id){
      var o={},src=PRODUCTS[id];
      SAVED_PRODUCT_FIELDS.forEach(function(f){o[f]=src[f]});
      /* Seeded photos live in the page; only the person's own photos are stored. */
      if(!SEEDED[id]){o.shape=src.shape;o.w=src.w;o.h=src.h;o.finish=src.finish;o.lines=src.lines;o.photo=src.photo||null}
      else if(src.photoUser&&src.photo){o.photo=src.photo;o.photoUser=true}
      prod[id]=o;
    });
    window.localStorage.setItem(STORE,JSON.stringify({
      tod:S.tod,mode:S.mode,skin:S.skin,routineState:S.routineState,steps:S.steps,
      current:S.current,sequenceKey:S.sequenceKey,overrides:S.overrides,history:S.history,
      journal:S.journal,prefs:S.prefs,routine:S.routine,completedKey:S.completedKey,
      dismissed:S.dismissed,replenish:S.replenish,weather:S.weather,products:prod
    }));
    STORAGE_OK=true;
  }catch(e){STORAGE_OK=false;/* storage unavailable; the app runs from memory */}
}
var STORAGE_OK=true;
/* Morning until five in the afternoon. An unfinished routine outranks the
   clock, so you come back to what you were doing. */
function todFromClock(){
  var h=new Date().getHours();
  return (h>=5&&h<17)?'am':'pm';
}
function load(){
  S.tod=todFromClock();
  try{
    var raw=window.localStorage.getItem(STORE)||window.localStorage.getItem(STORE_PREV);
    if(!raw)return;
    var d=JSON.parse(raw);
    if(!d||typeof d!=='object')return;
    ['mode','skin','routineState','current','sequenceKey'].forEach(function(k){
      if(d[k]!==undefined)S[k]=d[k];
    });
    /* Only an interrupted routine pins the time of day. */
    if(d.tod!==undefined&&(d.routineState==='IN_PROGRESS'||d.routineState==='PAUSED'))S.tod=d.tod;
    if(d.steps)S.steps=d.steps;
    if(d.overrides)S.overrides=d.overrides;
    if(d.history)S.history=d.history;
    if(d.journal)S.journal=d.journal;
    if(d.prefs)S.prefs=d.prefs;
    if(d.routine)S.routine={am:d.routine.am||null,pm:d.routine.pm||null};
    if(d.completedKey)S.completedKey=d.completedKey;
    if(d.dismissed)S.dismissed=d.dismissed;
    if(d.replenish)S.replenish=d.replenish;
    if(d.weather)S.weather=d.weather;
    if(d.products)Object.keys(d.products).forEach(function(id){
      if(PRODUCTS[id]){
        SAVED_PRODUCT_FIELDS.forEach(function(f){
          if(d.products[id][f]!==undefined)PRODUCTS[id][f]=d.products[id][f];
        });
        if(d.products[id].photoUser&&d.products[id].photo){PRODUCTS[id].photo=d.products[id].photo;PRODUCTS[id].photoUser=true}
      }
      else PRODUCTS[id]=rec(Object.assign({id:id},d.products[id]));
    });
  }catch(e){/* unreadable store; start fresh rather than fail */}
}
function pad(n){return (n<10?'0':'')+n}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
/* The polite live region. Saying the same thing twice still gets announced:
   an invisible zero-width space makes the second message a real change. */
function say(m){var l=el('live');if(!l)return;l.textContent=(l.textContent===m)?m+'​':m}
function now(){var d=new Date();return d}
function stamp(d){
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return pad(d.getDate())+' '+mo[d.getMonth()].toUpperCase()+' '+d.getFullYear();
}
function clock(d){return pad(d.getHours())+':'+pad(d.getMinutes())}

   4. SILHOUETTES
   Flat panels. No shadow, no gloss, no gradient, no third dimension.
   ================================================================ */
function shapeOf(kind,W,H){
  var cx=W/2,p=[];
  if(kind==='pump'){
    var bx=5,bw=W-5,pcx=bx+bw/2;
    p.push({x:0,y:10,w:pcx-8,h:5,role:'cap'});
    p.push({x:pcx-8,y:8,w:16,h:10,role:'cap'});
    p.push({x:pcx-7,y:18,w:14,h:10,role:'cap'});
    p.push({x:bx,y:28,w:bw,h:H-28,r:2,role:'body'});
  }else if(kind==='dropper'){
    p.push({x:cx-5,y:0,w:10,h:16,r:5,role:'cap'});
    p.push({x:cx-8,y:16,w:16,h:14,role:'cap'});
    p.push({x:0,y:30,w:W,h:H-30,r:2,role:'body'});
  }else if(kind==='tube'){
    p.push({x:cx-9,y:0,w:18,h:14,r:1,role:'cap'});
    p.push({x:cx-5,y:14,w:10,h:5,role:'cap'});
    p.push({x:0,y:19,w:W,h:H-24,r:1,role:'body'});
    p.push({x:0,y:H-5,w:W,h:5,role:'body'});
  }else if(kind==='jar'){
    p.push({x:3,y:0,w:W-6,h:H*0.42,r:1,role:'cap'});
    p.push({x:0,y:H*0.42,w:W,h:H*0.58,r:2,role:'body'});
  }else{
    p.push({x:2,y:0,w:W-4,h:H*0.28,r:1,role:'cap'});
    p.push({x:0,y:H*0.30,w:W,h:H*0.70,r:2,role:'body'});
  }
  return p;
}

function productVisual(id,scale,outlineOnly){
  var pr=PRODUCTS[id];
  if(pr.photo&&!outlineOnly){
    var h=Math.round(pr.h*scale),w=Math.round(h*(pr.photo.ar||0.5));
    return '<img class="pphoto" src="'+pr.photo.src+'" width="'+w+'" height="'+h+'" alt="">';
  }
  return svgFor(id,scale,outlineOnly);
}
function svgFor(id,scale,outlineOnly){
  var pr=PRODUCTS[id],panels=shapeOf(pr.shape,pr.w,pr.h),art=pr.art||{};
  var w=Math.round(pr.w*scale),h=Math.round(pr.h*scale);
  var body=outlineOnly?'none':(art.body||FILL[pr.finish]||FILL.opaque);
  var cap=outlineOnly?'none':(art.cap||CAPT[pr.finish]||CAPT.opaque);
  var o='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+pr.w+' '+pr.h+'" aria-hidden="true" focusable="false">';
  var main=null,i,q;
  for(i=0;i<panels.length;i++){
    q=panels[i];
    if(q.role==='body'&&(!main||q.h>main.h))main=q;
    o+='<rect x="'+q.x+'" y="'+q.y+'" width="'+q.w+'" height="'+q.h+'" rx="'+(q.r||0)+'" fill="'+
       (q.role==='body'?body:cap)+'" stroke="var(--dried-plum)" stroke-opacity="0.4" stroke-width="1" vector-effect="non-scaling-stroke"/>';
  }
  if(!outlineOnly&&main){
    /* the visible product inside a clear bottle */
    if(art.liquid){
      var lh=main.h*0.62;
      o+='<rect x="'+(main.x+1.2)+'" y="'+(main.y+main.h-lh)+'" width="'+(main.w-2.4)+'" height="'+(lh-1.2)+
         '" rx="'+(main.r||0)+'" fill="'+art.liquid+'"/>';
    }
    /* the label: a panel where the packaging has one, then the name */
    if(art.text){
      var lw=main.w*0.74,lx=main.x+(main.w-lw)/2;
      var lh2=Math.min(main.h*0.34,20),ly=main.y+main.h*0.40;
      if(art.labelBg)o+='<rect x="'+lx+'" y="'+ly+'" width="'+lw+'" height="'+lh2+'" rx="1" fill="'+art.labelBg+'"/>';
      o+='<text x="'+(main.x+main.w/2)+'" y="'+(ly+lh2/2+1.3)+'" text-anchor="middle" '+
         'font-family="IBM Plex Sans, sans-serif" font-size="3.4" letter-spacing="0.5" font-weight="600" fill="'+
         (art.textColor||'#3B3B3B')+'">'+art.text+'</text>';
    }
  }
  return o+'</svg>';
}

var MODE_SHORT={essential:'Simple',balanced:'The Usual',full:'Everything',thirty:'Thirty Seconds',recovery:'Soft'};
var WORDS=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
function word(n){return WORDS[n]||String(n)}
/* What each step is called in front of a person. The stored category keys do
   not change — only the words Dewy shows, in Title Case. */
var CAT_LABEL={CLEANSE:'Cleanse',TREAT:'Treat',SEAL:'Hydrate',FINISH:'Makeup Prep',
  PROTECT:'Protect',UNASSIGNED:'Unsorted'};
function cat(c){return CAT_LABEL[c]||(c.charAt(0)+c.slice(1).toLowerCase())}
function Word(n){var w=word(n);return w.charAt(0).toUpperCase()+w.slice(1)}

function pairBlocked(a,b){
  for(var i=0;i<S.overrides.neverPair.length;i++){
    var p=S.overrides.neverPair[i];
    if((p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a))return true;
  }
  return false;
}

function resolve(){
  var day=PLANS[S.tod],mode=S.mode,cand,minutes,note=null;
  if(mode==='thirty'){cand=day.thirty.slice();minutes='30 SECONDS';}
  else if(mode==='recovery'){cand=day.recovery.slice();minutes=(S.tod==='am'?2:1);}
  else{
    /* A routine the person has edited is a real list; otherwise the plan. */
    var own=S.routine&&S.routine[S.tod];
    cand=(own||CANDIDATES[S.tod][mode]).slice();
    minutes=own?Math.max(1,own.length):MINUTES[S.tod][mode];
  }

  var skin=S.skin?SKIN[S.skin]:null;
  var included=[],aside=[],excluded=[];

  /* --- eligibility, lifecycle, confidence, overrides --- */
  for(var i=0;i<cand.length;i++){
    var id=cand[i],p=PRODUCTS[id],why=[];
    if(!p){continue}
    var pinned=S.overrides.pinned[id];
    var eligible=(S.tod==='am')?p.morningEligible:p.eveningEligible;
    if(pinned===S.tod)eligible=true;
    if(pinned&&pinned!==S.tod)eligible=false;

    if(S.overrides.hidden[id]||S.overrides.removed[id])why.push('MANUAL_OVERRIDE');
    else if(!eligible)why.push('TIME_OF_DAY');
    else if(id===S.pendingReview){/* status changed, routine not recalculated until confirmed */}
    else if(p.status==='TRAVEL_ONLY'&&!S.prefs.travel)why.push('PRODUCT_LIFECYCLE');
    else if(!ELIGIBLE_LIFE[p.status])why.push('PRODUCT_LIFECYCLE');
    else if(p.confidence==='UNKNOWN')why.push('PRODUCT_CONFIDENCE');

    if(why.length&&S.overrides.useAnyway[id]&&why[0]!=='MANUAL_OVERRIDE')why=[];
    if(why.length)excluded.push({id:id,reasons:why});
    else included.push(id);
  }

  /* --- personal state --- */
  if(skin&&S.skin==='irritated'&&mode!=='recovery'&&mode!=='thirty'){
    included=included.filter(function(id){
      if(PRODUCTS[id].active){aside.push({id:id,reasons:['USER_REPORTED_STATE']});return false}
      return true;
    });
  }
  if(skin&&(S.skin==='dry'||S.skin==='tight')&&S.tod==='pm'){
    /* the richer moisturizer takes the step; the lighter one waits */
    var a1=included.indexOf('summerfridays'),b1=included.indexOf('cerave');
    if(a1>-1&&b1>a1){included[a1]='cerave';included[b1]='summerfridays';}
  }

  /* --- overlap: one product per filled step --- */
  var seen={};
  included=included.filter(function(id){
    var c=PRODUCTS[id].category;
    if(c==='SEAL'){
      if(seen[c]){aside.push({id:id,reasons:['PRODUCT_OVERLAP']});return false}
      seen[c]=id;
    }
    return true;
  });

  /* --- one strong treatment a night; the retinoid holds its place --- */
  var actives=included.filter(function(id){return PRODUCTS[id].active});
  if(actives.length>1){
    var keepA=actives.filter(function(id){return PRODUCTS[id].kind==='Retinoid'})[0]||actives[0];
    included=included.filter(function(id){
      if(PRODUCTS[id].active&&id!==keepA){aside.push({id:id,reasons:['ACTIVE_CONFLICT']});return false}
      return true;
    });
  }

  /* --- pairings the user chose to keep apart --- */
  var kept=[];
  included.forEach(function(id){
    for(var k=0;k<kept.length;k++){
      if(pairBlocked(kept[k],id)){aside.push({id:id,reasons:['PRODUCT_CONFLICT','MANUAL_OVERRIDE']});return}
    }
    kept.push(id);
  });
  included=kept;

  /* --- order by routine role, stable within a role --- */
  /* A person's own order is authoritative; the plan's order follows ORDER. */
  if(!own)included.sort(function(a,b){
    return ORDER.indexOf(PRODUCTS[a].category)-ORDER.indexOf(PRODUCTS[b].category);
  });

  /* --- routine-level reasons --- */
  var rtags=[];
  if(mode==='recovery'||(skin&&skin.recovery&&S.skin==='irritated'))rtags.push('USER_REPORTED_STATE');
  if(aside.some(function(a){return a.reasons.indexOf('PRODUCT_OVERLAP')>-1}))rtags.push('PRODUCT_OVERLAP');
  if(!rtags.length)rtags.push('TIME_OF_DAY','ROUTINE_MODE');
  if(S.tod==='am'&&mode==='full'&&included.length===CANDIDATES.am.balanced.length-1){}

  var label=MODE_NAME[mode]||mode;
  return {day:day,mode:mode,label:label,steps:included,aside:aside,excluded:excluded,
          minutes:minutes,reasons:rtags.slice(0,2),skin:skin,
          line:mode==='thirty'?day.thirtyLine:mode==='recovery'?day.recoveryLine:null};
}

function keyOf(r){return S.tod+'|'+S.mode+'|'+(S.skin||'')+'|'+r.steps.join(',')}

/* Keep step state coherent with the routine actually in force. */
function syncSteps(r){
  var k=keyOf(r);
  if(k!==S.sequenceKey){
    if(S.routineState==='IN_PROGRESS'||S.routineState==='PAUSED'){
      /* the sequence changed underneath an active routine */
      S.routineState='NOT_STARTED';S.steps={};S.current=null;
    }
    S.sequenceKey=k;
  }
  r.steps.forEach(function(id){if(!S.steps[id])S.steps[id]='PENDING'});
  Object.keys(S.steps).forEach(function(id){if(r.steps.indexOf(id)<0)delete S.steps[id]});
  if(S.current&&r.steps.indexOf(S.current)<0)S.current=null;
}
function nextPending(r){
  for(var i=0;i<r.steps.length;i++){if(S.steps[r.steps[i]]==='PENDING')return r.steps[i]}
  return null;
}
function settled(r){return r.steps.every(function(id){return S.steps[id]==='COMPLETED'||S.steps[id]==='SKIPPED'})}

/* ================================================================
   6. SHELF SCALE
   One scale for every product so relative sizes stay true.
   ================================================================ */
var MIN_SCALE=0.85,MAX_SCALE=1.45,OBJ_CHROME=14; /* contour padding plus border */
function scaleFor(ids){
  var mm=0;
  for(var i=0;i<ids.length;i++)mm+=PRODUCTS[ids[i]].w;
  var chrome=24*Math.max(0,ids.length-1)+32+OBJ_CHROME*ids.length;
  var avail=Math.max(280,document.documentElement.clientWidth)-chrome;
  var s=avail/Math.max(1,mm);
  return s>MAX_SCALE?MAX_SCALE:(s<MIN_SCALE?MIN_SCALE:s);
}

function reasonLine(tags){
  if(!tags||!tags.length)return '';
  var t=tags.slice(0,2).map(function(x){return REASONS[x]?REASONS[x].short:x}).join(' + ');
  return '<p class="t-meta" style="opacity:.7;margin-top:var(--s16)">Reason</p>'+
         '<p class="t-body">'+esc(t)+'</p>';
}
function whyBlock(id,tags,openKey){
  var open=S.ui[openKey];

    var r=REASONS[x];return r?'<p class="t-meta" style="opacity:.7">'+esc(r.head)+'</p><p class="t-body">'+esc(r.text)+'</p>':''
  }).join('');
  return '<button type="button" class="t-body linkish" data-act="toggle" data-key="'+esc(openKey)+'" '+
         'aria-expanded="'+(open?'true':'false')+'" id="why-'+esc(openKey)+'">Why?</button>'+
         (open?'<div class="disclosure stack">'+body+
           '<button type="button" class="t-body linkish" data-act="close-why" data-key="'+esc(openKey)+'">Close</button></div>':'');
}
/* Why This Step: the product's own reason when one is recorded, otherwise
   the general, non-medical placement guidance, labelled as such. */
function whyStepHTML(c){

  return '<p><button type="button" class="t-caption linkish why" data-act="toggle" data-key="stepwhy" aria-expanded="'+(S.ui.stepwhy?'true':'false')+'" id="why-stepwhy">Why This Step</button></p>'+

      (generic?'<p class="t-caption" style="opacity:.7">General Guidance · Not Medical Advice</p>':'')+
      '<p class="t-body">'+esc(why)+'</p>'+
      '<p class="t-caption" style="opacity:.7;margin-top:var(--s8)">This order is guidance, not a rule. Product directions and a clinician’s advice come first.</p>'+
      '<button type="button" class="t-body linkish" data-act="close-why" data-key="stepwhy">Close</button></div>':'');
}
/* The Edit Routine panel: every change is a visible button, nothing drags. */

  });
  h+='</div>';
  var addable=Object.keys(PRODUCTS).filter(function(id){

  h+='<p style="margin-top:var(--s16)"><button type="button" class="btn btn-done" data-act="routine-done">Done Editing</button></p></section>';

function objectHTML(id,scale,opts){
  var p=PRODUCTS[id],st=opts.state,cur=st==='CURRENT';
  var outline=(p.confidence==='UNKNOWN');
  var label='';
  if(st==='SET_ASIDE')label=p.kind+'. '+p.brand+' '+p.productName+'. Set aside tonight because '+esc(opts.asideWhy||'it overlaps with another step')+'.';
  else label='Step '+opts.n+' of '+opts.total+'. '+(cur?'Current. ':'')+p.kind+'. '+p.brand+' '+p.productName+'.'+
             (st==='COMPLETED'?' Completed.':st==='SKIPPED'?' Skipped.':'')+
             (cur&&p.lines?' '+p.lines[0]:'');
  return '<button type="button" class="obj'+(cur?' current':'')+(st==='COMPLETED'?' done':'')+(st==='SKIPPED'?' skipped':'')+(st==='SET_ASIDE'?' set-aside':'')+'" '+
    'data-act="obj" data-id="'+esc(id)+'"'+(cur?' aria-current="step"':'')+' aria-label="'+esc(label)+'">'+
