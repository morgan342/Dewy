/* Under the shelf, one line at most, and only when it carries meaning.
   A product waiting its turn says nothing — the object is the label. The
   current product is the one place its name is printed. Anything set aside
   or skipped keeps a word, because an exception has to be explainable
   without relying on how it looks. */
function underHTML(id,opts){
  var st=opts.state,text='',cls='';
  /* The current product is named once, at full size, in the panel directly
     below the shelf — so nothing is printed under the object itself. Set-aside
     products are named in the Set Aside note for the same reason. What is left
     here is the one case with no prose anywhere else. */
  if(st==='SKIPPED'){text='Skipped';cls=' status'}
  else if(st==='UNAVAILABLE'){text='Not Available';cls=' status'}
  return '<div class="under'+(st==='SET_ASIDE'?' set-aside':'')+'">'+
    (text?'<span class="t-caption'+cls+'">'+esc(text)+'</span>':'')+'</div>';
}

/* ================================================================
   8. ROUTINE SCREEN
   ================================================================ */
function viewRoutine(){
  var r=resolve();syncSteps(r);
  /* A routine finished on another day, or for the other time of day, starts fresh. */
  if(S.routineState==='COMPLETED'&&S.completedKey!==S.tod+'|'+stamp(now())){
    S.routineState='NOT_STARTED';S.steps={};S.current=null;
    r=resolve();syncSteps(r);
  }
  var day=r.day,steps=r.steps;
  var done=settled(r)&&S.routineState==='COMPLETED';
  var ids=steps.concat(r.aside.map(function(a){return a.id}));
  var scale=scaleFor(ids);
  var h='';

  /* --- header field --- */
  var todWord=S.tod==='am'?'Morning':'Evening';
  h+='<header class="field" data-tod="'+S.tod+'">'+
     brandBar('Cabinet','cabinet')+
     '<div class="field-top">'+
       '<p class="t-eyebrow">'+steps.length+(steps.length===1?' Step':' Steps')+(r.minutes==='30 SECONDS'?' · 30 Seconds':' · About '+r.minutes+(r.minutes===1?' Minute':' Minutes'))+'</p>'+
       '<nav class="tod t-meta" aria-label="Time of day">'+
         '<button type="button" data-act="tod" data-v="am" aria-pressed="'+(S.tod==='am')+'">Morning</button>'+
         '<button type="button" data-act="tod" data-v="pm" aria-pressed="'+(S.tod==='pm')+'">Evening</button>'+
       '</nav></div>'+
     '<h1 class="t-screen-title routine-title">'+(S.tod==='am'?'This Morning':'Tonight')+'</h1><p class="sr-only">'+esc(day.when)+'</p>'+
     '<p class="sr-only">'+esc(done?day.complete:day.greeting)+' '+esc(r.mode==='thirty'?'Thirty seconds.':r.mode==='recovery'?(S.tod==='am'?'Soft. Cleanse, moisturize, and protect.':'Soft. Cleanse, moisturize, and stop there.'):(S.tod==='pm'&&steps.some(function(x){return PRODUCTS[x].kind==='Retinoid'})?'A retinoid night.':day.type))+' '+
       Word(steps.length)+(steps.length===1?' step. ':' steps. ')+
       (r.minutes==='30 SECONDS'?'About thirty seconds.':'About '+word(r.minutes)+(r.minutes===1?' minute.':' minutes.'))+' '+esc(todWord)+' routine.</p></header>';
  var focusHTML='',lateHTML='';

  /* focus card markup is prepared here and stitched into the header above */
  /* --- what deserves attention now ---
     One line, drawn from the routine in force: a reported skin state first,
     then a product held back, then a treatment step, then the plain plan. */
  if(S.routineState!=='COMPLETED'){
    var focusTitle,focusLine;
    var activeSteps=steps.filter(function(x){return PRODUCTS[x].active});
    var treat=activeSteps.filter(function(x){return PRODUCTS[x].kind==='Retinoid'})[0]||activeSteps[0];
    if(S.skin&&SKIN[S.skin].recovery){
      focusTitle='Keep It Gentle';
      focusLine='You said your skin feels '+S.skin+'. The treatment steps are set aside.';
    } else if(r.aside.length){
      var a0=PRODUCTS[r.aside[0].id];
      focusTitle=(S.tod==='am'?'This morning':'Tonight')+', in short';
      focusLine=(treat?PRODUCTS[treat].kind+' '+(S.tod==='am'?'this morning':'tonight')+'. ':'')+
        'Leave out the second '+a0.kind.toLowerCase()+'.';
    } else if(treat){
      focusTitle=(S.tod==='am'?'This morning':'Tonight')+', in short';
      focusLine=PRODUCTS[treat].kind+' '+(S.tod==='am'?'this morning':'tonight')+'. Keep the rest simple.';
    } else {
      focusTitle=(S.tod==='am'?'This morning':'Tonight')+', in short';
      focusLine=Word(steps.length)+' steps. Nothing to work around.';
    }
    /* a second line when the record or the clock has something to add */
    var focusLine2=null;
    if(S.tod==='pm'&&treat){
      var ago=lastTreatmentAgoHours();
      if(ago!==null&&ago<20){
        focusLine2='Treatment was used last night. Soft is enough tonight.';
      } else {
        focusLine2='Next treatment night: tonight.';
      }
    }
    var hr=new Date().getHours();
    if(S.tod==='pm'&&hr>=22&&steps.length>2&&r.mode!=='thirty'&&r.mode!=='recovery'){
      focusLine2='It is late. The two step version still counts.';
    }
    focusHTML+='<button type="button" class="focus" data-act="toggle" data-key="focusOpen" '+
       'aria-expanded="'+(S.ui.focusOpen?'true':'false')+'">'+
       '<span class="fbody"><span class="t-eyebrow line">One Suggestion</span>'+
       '<span class="t-body line fl">'+esc(focusLine)+'</span>'+
       '<span class="t-caption line" style="opacity:.75">'+esc(focusLine2||'Tap for options.')+'</span>'+
       '</span></button>';
    if(S.ui.focusOpen){
      var whyRows=r.reasons.slice(0,2).map(function(t){var rr=REASONS[t];
        return rr?'<p class="t-meta line" style="opacity:.7">'+esc(rr.head)+'</p><p class="t-body line">'+esc(rr.text)+'</p>':''}).join('');
      focusHTML+='<section class="focuspanel">'+whyRows+
         '<div class="quiet-row">'+
         (r.mode!=='thirty'?'<button type="button" class="t-body linkish" data-act="mode" data-v="thirty">Make It Thirty Seconds</button>':'')+
         (r.mode!=='recovery'?'<button type="button" class="t-body linkish" data-act="mode" data-v="recovery">'+(S.tod==='am'?'Keep This Morning Soft':'Keep Tonight Soft')+'</button>':'')+
         '</div></section>';
    }
  }

  /* --- mode index or routine state --- */
  if(r.mode==='thirty'){
    h+='<div class="routine-state"><p class="t-meta">'+esc(r.label)+'</p>'+
       '<button type="button" class="t-body back" data-act="mode" data-v="balanced">Back To The Usual</button></div>'+
       '<div class="page" style="padding-bottom:0"><p class="t-body">'+esc(r.line)+'</p>'+
       whyBlock(null,r.mode==='recovery'?['USER_REPORTED_STATE']:['ROUTINE_MODE'],'modewhy')+'</div>';
  } else {
    /* Four abstract words in a segmented control read as a settings panel.
       One plain line says where the routine stands; Change opens the choices
       only for the person who wants them. */
    lateHTML+='<section class="modeline"><div class="row">'+
       '<p class="t-body">'+esc(MODE_FULL[S.mode]||MODE_NAME[S.mode]||'')+'.</p>'+
       '<button type="button" class="t-meta change" data-act="toggle" data-key="modeOpen" '+
       'aria-expanded="'+(S.ui.modeOpen?'true':'false')+'">Change</button></div>';
    if(S.ui.modeOpen){
      lateHTML+='<div class="modeopts" role="group" aria-label="Routine Length">';
      ['essential','balanced','full','recovery'].forEach(function(m){
        lateHTML+='<button type="button" class="t-body" data-act="mode" data-v="'+m+'" '+
           'aria-pressed="'+(S.mode===m)+'">'+esc(MODE_FULL[m]||MODE_NAME[m])+'</button>';
      });
      lateHTML+='</div>';
    }
    lateHTML+='</section>';
  }

  /* --- resume prompt --- */
  if(S.routineState==='PAUSED'){
    var res=S.current||nextPending(r);
    lateHTML+='<section class="confirm"><p class="t-meta">Routine In Progress</p>'+
       '<p class="t-body line">Resume at step '+word(r.steps.indexOf(res)+1)+', or start again.</p>'+
       '<div class="row"><button type="button" data-act="resume">Resume</button>'+
       '<button type="button" class="secondary" data-act="restart">Restart</button></div></section>';
  }

  /* --- skin state --- */
  if(!S.skin){
    lateHTML+='<section class="skin">'+
      '<button type="button" class="t-meta skin-q" data-act="toggle" data-key="skinOpen" '+
      'aria-expanded="'+(S.ui.skinOpen?'true':'false')+'">How Does Your Skin Feel?</button>';
    if(S.ui.skinOpen){
      lateHTML+='<div class="skin-opts t-meta">';
      ['comfortable','dry','tight','sensitive','irritated'].forEach(function(k){
        lateHTML+='<button type="button" data-act="skin" data-v="'+k+'" aria-pressed="false">'+k.charAt(0).toUpperCase()+k.slice(1)+'</button>';
      });
      lateHTML+='</div>';
    }
    lateHTML+='</section>';
  } else {
    var sk=SKIN[S.skin],lines=(S.tod==='am'&&sk.linesAm)?sk.linesAm:sk.lines;
    lateHTML+='<section class="skin"><div class="skin-status"><div class="row">'+
       '<p class="t-meta">'+esc(sk.label)+'</p>'+
       '<button type="button" class="t-meta change" data-act="skin-clear">Change</button></div>'+
       lines.map(function(l){return '<p class="t-body line">'+esc(l)+'</p>'}).join('')+
       (sk.care?'<p class="t-caption care">'+esc(sk.care)+'</p>':'')+
       (sk.recovery&&S.mode!=='recovery'?'<p style="margin-top:var(--s8)"><button type="button" class="t-body linkish" data-act="mode" data-v="recovery">'+(S.tod==='am'?'Keep This Morning Soft':'Keep Tonight Soft')+'</button></p>':'')+
       '</div></section>';
  }

  /* --- the steps, in order: a calm numbered list with a visible check --- */
  var rows='',n=0;
  steps.forEach(function(id){
    n++;
    var sp=PRODUCTS[id],st=(S.current===id&&S.routineState==='IN_PROGRESS')?'CURRENT':S.steps[id];
    var cls=st==='COMPLETED'?'done':st==='SKIPPED'?'skipped':st==='CURRENT'?'current':'';
    var word=st==='COMPLETED'?'Completed':st==='SKIPPED'?'Skipped':st==='CURRENT'?'Current':'Pending';
    rows+='<li><button type="button" class="steprow '+cls+'" data-act="detail" data-id="'+esc(id)+'" aria-label="Step '+n+' of '+steps.length+'. '+esc(cat(sp.category))+'. '+esc(sp.brand+' '+sp.productName)+'. '+word+'.">'+
      '<span class="sw">'+productVisual(id,0.28,sp.confidence==='UNKNOWN')+'</span>'+
      '<span class="stx"><span class="t-eyebrow st">'+n+' · '+esc(cat(sp.category))+'</span>'+
      '<span class="t-body nm">'+esc(sp.brand+' '+sp.productName)+'</span></span>'+
      '<span class="chk" aria-hidden="true"></span></button></li>';
  });
  r.aside.forEach(function(a){
    n++;
    var ap=PRODUCTS[a.id],w=REASONS[a.reasons[0]]?REASONS[a.reasons[0]].short:'Set Aside';
    rows+='<li><button type="button" class="steprow aside" data-act="detail" data-id="'+esc(a.id)+'" aria-label="Set aside. '+esc(ap.brand+' '+ap.productName)+'. '+esc(w)+'.">'+
      '<span class="sw">'+productVisual(a.id,0.28,ap.confidence==='UNKNOWN')+'</span>'+
      '<span class="stx"><span class="t-eyebrow st">Set Aside</span>'+
      '<span class="t-body nm">'+esc(ap.brand+' '+ap.productName)+'</span>'+
      '<span class="t-caption" style="opacity:.7">'+esc(w)+'</span></span>'+
      '<span class="chk none" aria-hidden="true"></span></button></li>';
  });
  var listHTML='<ol class="steprows" aria-label="Products in routine order">'+rows+'</ol>';
  h+='<main>'+(S.routineState==='IN_PROGRESS'?'':listHTML);
  /* The order is Dewy's suggestion, and it says so. Product directions and
     anything a clinician prescribed come first, and every step is editable. */


  /* --- instruction panel --- */
  if(S.routineState==='IN_PROGRESS'&&(S.current||S.ui.peek)){
    var peekId=S.ui.peek&&steps.indexOf(S.ui.peek)>-1?S.ui.peek:null;
    var heroId=peekId||S.current;
    if(heroId&&PRODUCTS[heroId]){
      var c=PRODUCTS[heroId],idx=steps.indexOf(heroId)+1,isPeek=!!peekId&&peekId!==S.current,nxId=steps[idx];
      /* The step is a card in the hand: the next step sits beneath it, and
         the two rails name exactly where a drag will put it. */
      h+='<div class="stack" data-stack="steps">'+
         '<div class="stack-rail left" aria-hidden="true">Not Now</div>'+
         '<div class="stack-rail right" aria-hidden="true">Mark Complete</div>'+
         (nxId?'<div class="stack-next" aria-hidden="true"><p class="t-meta" style="opacity:.6">Step '+(idx+1)+' Of '+steps.length+'</p>'+
            '<p class="t-body">'+esc(PRODUCTS[nxId].brand+' '+PRODUCTS[nxId].productName)+'</p></div>':'')+
         '<section class="panel stack-hero enter" tabindex="0" role="group" aria-label="'+
           esc((isPeek?'Viewing step ':'Current step ')+idx+' of '+steps.length+': '+c.brand+' '+c.productName+'. '+
           (isPeek?'Down arrow returns to the current step.':'Right arrow or S marks it complete, left arrow or N sets it aside, up and down look at other steps. The buttons below do the same.'))+'">'+
         '<div class="hero-pv" aria-hidden="true">'+productVisual(heroId,Math.min(1.6,150/Math.max(1,c.h)),c.confidence==='UNKNOWN')+'</div>'+
         '<p class="t-meta eyebrow" style="opacity:.6">'+(isPeek?'Viewing ':'')+'Step '+idx+' Of '+steps.length+' &middot; '+esc(cat(c.category))+'</p>'+
         '<h2 class="t-section-heading pname">'+esc(c.brand+' '+c.productName)+'</h2>'+
         directionsHTML(c,true)+
         (c.confidence==='INFERRED'?'<p class="t-caption" style="margin-top:var(--s8);opacity:.8">'+esc(CONF.INFERRED.text)+'</p>':'')+
         whyStepHTML(c)+
         (isPeek?'<p style="margin-top:var(--s8)"><button type="button" class="t-caption linkish" data-act="stack-peek-clear">Back To Current Step</button></p>':'')+
         '</section></div>';
      if(S.ui.demoStack)h+='<p class="t-caption stack-hint">Demo · Drag the card: right marks it complete, left sets it aside for now, up or down looks at other steps. The buttons below do the same.</p>';
    }
  }

  /* --- completion --- */
  if(S.routineState==='COMPLETED'){
    var usedN=steps.filter(function(id){return S.steps[id]==='COMPLETED'}).length;
    var skippedN=steps.filter(function(id){return S.steps[id]==='SKIPPED'}).length;
    var head=(S.tod==='am'?'Morning':'Evening')+' Routine Complete';
    var line=r.mode==='recovery'?'The routine ends here.':
             r.mode==='essential'?Word(usedN)+' steps were enough.':day.completeLine;
    h+='<section class="complete-state"><h2 class="t-routine-heading">'+esc(head)+'</h2>'+
       '<p class="t-body line">'+esc(line)+'</p>'+
       '<p class="t-body count">'+Word(usedN)+(usedN===1?' step completed.':' steps completed.')+
         (skippedN?' '+Word(skippedN)+(skippedN>1?' steps skipped.':' step skipped.'):'')+'</p>'+
       '<p style="margin-top:var(--s16)"><button type="button" class="t-body linkish" data-act="restart">Back To Routine</button></p>'+
       '</section>';
  }

  /* --- actions --- */
  h+='<div class="actions">';
  if(S.ui.stackUndo&&PRODUCTS[S.ui.stackUndo.id]){
    var su=S.ui.stackUndo;
    h+='<div class="stack-undo" role="status"><span class="t-caption">'+esc(PRODUCTS[su.id].productName)+
       (su.mark==='COMPLETED'?' marked complete.':' set aside for now.')+'</span>'+
       '<button type="button" class="t-body linkish" data-act="stack-undo">Undo</button></div>';
  }
  if(S.routineState==='NOT_STARTED'){
    h+=steps.length?(
        '<button type="button" class="btn btn-begin" data-act="begin">Begin Routine '+ICONS.arrow+'</button>'
       ):
       ('<section class="notice" style="margin:0"><p class="t-meta">No Routine Yet</p>'+
       
       '<p><button type="button" class="btn btn-done" data-act="routine-edit">Add From Cabinet</button></p>'+
       '<p><button type="button" class="t-body linkish" data-act="go-add-search">Add A Product</button></p></section>');
  } else if(S.routineState==='IN_PROGRESS'){
    /* One action, then a quiet look ahead so the next step is never a
       surprise — and the order is offered as guidance, not instruction. */
    var ci=steps.indexOf(S.current),nx=null,nxName='';
    for(var k=ci+1;k<steps.length;k++){if(S.steps[steps[k]]==='PENDING'){nx=steps[k];break}}
    if(nx)nxName=PRODUCTS[nx].brand+' '+PRODUCTS[nx].productName;
    h+='<button type="button" class="btn btn-begin" data-act="done">Mark Complete</button>'+
       '<p class="t-caption nextup" style="margin-top:var(--s8);opacity:.7">'+(nxName?'Next: '+esc(nxName):'Last Step')+'</p>'+
       '<div class="quiet-row">'+
       (ci>0?'<button type="button" class="t-body linkish" data-act="back-step">Back</button>':'')+
       '<button type="button" class="t-body linkish" data-act="skip">Skip</button>'+
       '<button type="button" class="t-body linkish" data-act="pause">Pause</button></div>';
  }
  h+='</div>'+focusHTML;
  /* everything that is not the routine itself waits behind one word */
  if(S.routineState!=='COMPLETED'&&steps.length){
    var alt='';
    if(r.mode!=='thirty')alt+='<button type="button" class="t-body linkish" data-act="mode" data-v="thirty">Make It Thirty Seconds</button>';
    if(r.mode!=='recovery')alt+='<button type="button" class="t-body linkish" data-act="mode" data-v="recovery">'+(S.tod==='am'?'Keep This Morning Soft':'Keep Tonight Soft')+'</button>';
    h+='<div class="rowlist"><button type="button" class="textrow t-meta" data-act="toggle" data-key="routineMore" aria-expanded="'+(S.ui.routineMore?'true':'false')+'">'+
       (S.ui.routineMore?'Less':'More')+'</button></div>';
    if(S.ui.routineMore)h+=lateHTML+(alt?'<div class="actions" style="padding-top:var(--s8)"><div class="quiet-row">'+alt+'</div></div>':'');
  } else if(S.routineState!=='COMPLETED'){
    h+=lateHTML;
  }

  /* --- every step, on request: completed and skipped steps stay inspectable
         without the whole routine turning into a checklist --- */
  if(S.routineState!=='NOT_STARTED'&&steps.length){
    h+='<div class="rowlist"><button type="button" class="textrow t-meta" data-act="toggle" data-key="stepsOpen" aria-expanded="'+(S.ui.stepsOpen?'true':'false')+'">'+
       (S.ui.stepsOpen?'Hide All Steps':'Show All Steps')+'</button></div>';
    if(S.ui.stepsOpen){
      h+='<ol class="steplist" aria-label="All steps">'+steps.map(function(id,i){
        var st=S.steps[id],w=id===S.current?'Current':st==='COMPLETED'?'Completed':st==='SKIPPED'?'Skipped':'Pending';
        return '<li class="t-body"><span>'+(i+1)+'. '+esc(PRODUCTS[id].brand+' '+PRODUCTS[id].productName)+'</span>'+
               '<span class="t-caption" style="opacity:.75">'+w+'</span></li>';
      }).join('')+'</ol>';
    }
  }
  if(S.ui.routineEdit)h+=routineEditHTML(r);

  /* --- set aside note --- */
  if(r.aside.length){
    var tags=[];
    h+='<section class="setaside"><p class="t-meta label">Set Aside</p>';
    r.aside.forEach(function(a){
      var p0=PRODUCTS[a.id];
      var kept=steps.filter(function(x){return PRODUCTS[x].category===p0.category})[0];
      a.reasons.forEach(function(t){if(tags.indexOf(t)<0)tags.push(t)});
      h+='<p class="t-body" style="margin-top:var(--s8)">'+esc(p0.brand+' '+p0.productName)+' '+
        (a.reasons[0]==='USER_REPORTED_STATE'?'is set aside while your skin feels irritated.':
         a.reasons[0]==='ACTIVE_CONFLICT'?'sits out tonight. One strong treatment a night is enough.':
         a.reasons[0]==='PRODUCT_CONFLICT'?'is kept apart at your request.':
         'overlaps with '+esc(kept?PRODUCTS[kept].productName:'another step')+'. One can wait.')+'</p>';
    });
    h+=whyBlock(null,tags,'asidewhy')+'</section>';
  }

  /* --- excluded, with the reason --- */
  if(r.excluded.length){
    h+='<section class="notice"><p class="t-meta">Not In This Routine</p>';
    r.excluded.forEach(function(x){
      var p=PRODUCTS[x.id],rr=REASONS[x.reasons[0]];
      h+='<p class="t-body line">'+esc(p.brand+' '+p.productName)+'. '+esc(rr?rr.text:'')+'</p>';
    });
    h+='</section>';
  }

  /* --- the week, synthesized from the record, never written by hand --- */
  if(S.routineState==='NOT_STARTED'){
    var cut=new Date().getTime()-7*24*3600000;
    var runs=S.history.filter(function(e){return e.kind==='routine'&&e.state==='COMPLETED'&&e.ts>cut});
    if(runs.length){
      var byMode={};runs.forEach(function(e){byMode[e.mode]=(byMode[e.mode]||0)+1});
      var topMode=Object.keys(byMode).sort(function(a,b){return byMode[b]-byMode[a]})[0];
      var wline=Word(runs.length)+(runs.length===1?' routine completed.':' routines completed.');
      if(runs.length>1&&byMode[topMode]>1)wline+=' Most ran the '+topMode.toLowerCase()+' routine.';
      var skips=runs.reduce(function(t,e){return t+e.skipped.length},0);
      h+='<section class="weekcard"><p class="t-meta">This Week</p>'+
         '<p class="t-body line">'+esc(wline)+'</p>'+
         (skips?'<p class="t-caption line" style="opacity:.75">'+esc(Word(skips)+(skips===1?' step skipped, and recorded.':' steps skipped, and recorded.'))+'</p>':'')+
         '</section>';
    }
  }

  /* --- what you noted last time --- */
  if(S.routineState==='NOT_STARTED'&&S.journal.length){
    var jj=S.journal[0];
    h+='<section class="memorycard"><span class="avatar">'+ICONS.heart+'</span>'+
       '<button type="button" class="mbody" data-act="tab" data-v="journal">'+
       '<span class="t-body">Last time you noted '+esc(jj.obs.map(function(o){return o.toLowerCase()}).join(', '))+'.</span>'+
       '</button>'+ICONS.chev+'</section>';
  }

  /* --- routine-level reason --- */
  if(S.routineState!=='COMPLETED'&&S.ui.routineMore){
    h+='<div class="page">'+reasonLine(r.reasons)+whyBlock(null,r.reasons,'routinewhy')+'</div>';
  }

  /* --- dialogs --- */
  if(S.ui.dialog)h+=dialogHTML();

  h+='<footer><p class="t-caption">Guidance, not a rule. Not medical advice.</p>'+
     '<p class="t-caption">If skin reacts, stop and see a clinician.</p></footer>'+
     footWord(S.tod==='am'?'Morning':'Tonight')+
     '<div class="foot-line"><button type="button" data-act="go-add-search">Add A Product</button>'+
     '<button type="button" data-act="routine-edit">Edit Routine</button></div></main>';
  return h;
}

  var d=S.ui.dialog;
  return '<section class="confirm" role="alertdialog" aria-labelledby="dlg-head" aria-describedby="dlg-body"><p class="t-meta" id="dlg-head">'+esc(d.head)+'</p>'+
    '<p class="t-body line" id="dlg-body">'+esc(d.body)+'</p><div class="row">'+
    '<button type="button" data-act="dlg-yes" id="dlg-yes">'+esc(d.yes)+'</button>'+

  var y=el('dlg-yes');if(y)y.focus();}

/* ================================================================
   9. HISTORY
   ================================================================ */
function logRoutine(r,finalState){
  var d=now();
  var entry={kind:'routine',ts:d.getTime(),date:stamp(d),time:clock(d),
    tod:S.tod==='am'?'Morning':'Evening',mode:MODE_SHORT[r.mode]||r.label,
    products:r.steps.filter(function(i){return S.steps[i]==='COMPLETED'}),
    skipped:r.steps.filter(function(i){return S.steps[i]==='SKIPPED'}),
    aside:r.aside.map(function(a){return a.id}),
    skin:S.skin,reasons:r.reasons.slice(),state:finalState};
  S.history.unshift(entry);
  entry.products.concat(entry.skipped).forEach(function(id){
    PRODUCTS[id].routineHistory.unshift({ts:entry.ts,date:entry.date,tod:entry.tod,mode:entry.mode,
      result:entry.skipped.indexOf(id)>-1?'SKIPPED':'COMPLETED'});
  });
}
function logEvent(kind,head,detail,reversible,undo){
  var d=now();
  S.history.unshift({kind:kind,ts:d.getTime(),date:stamp(d),time:clock(d),
    head:head,detail:detail,reversible:!!reversible,undo:undo||null});
}

/* ================================================================
   10. CABINET
   ================================================================ */
/* Where a product can appear, across every standard routine, not only the
   one currently on screen. */
/* Where every product lives across the six routine variants, computed once
   per render instead of six resolve() calls per card. render() clears it. */
var _memMap=null;
function membershipMap(){
  if(_memMap)return _memMap;
  var keepT=S.tod,keepM=S.mode,map={};
  ['am','pm'].forEach(function(t){
    var name=t==='am'?'Morning':'Evening';
    ['essential','balanced','full'].forEach(function(mo){
      S.tod=t;S.mode=mo;
      var r=resolve();
      r.steps.forEach(function(id){var m=map[id]=map[id]||{};m[name]='step'});
      r.aside.forEach(function(a){var m=map[a.id]=map[a.id]||{};if(m[name]!=='step')m[name]='aside'});
    });
  });
  S.tod=keepT;S.mode=keepM;
  _memMap=map;
  return map;
}
function membership(id){
  var m=membershipMap()[id]||{},out=[];
  ['Morning','Evening'].forEach(function(n){
    if(m[n]==='step')out.push(n);else if(m[n]==='aside')out.push(n+' (set aside)');
  });
  return out.length?out.join(' / '):'Not in a routine';
}
function inAnyRoutine(id){var m=membershipMap()[id]||{};return m.Morning==='step'||m.Evening==='step'}
/* One status word per product. Always a word, never colour alone. */
function statusWord(id){
  var p=PRODUCTS[id];
  if(p.status==='EMPTY'||p.status==='REPLACED'||p.status==='ARCHIVED')return 'Finished';
  if(p.status==='UNAVAILABLE')return 'Paused';
  if(p.status==='NEARLY_EMPTY')return 'Low';
  if(p.status==='TRAVEL_ONLY')return 'Travel Only';
  if(p.occasional)return 'Every So Often';
  if(inAnyRoutine(id))return 'In Routine';
  return 'In Use';
}
var STATUS_GLYPH={
  'In Routine':'<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2.5 6.5l2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  'Low':'<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><rect x="3.5" y="1.5" width="5" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="4.5" y="7" width="3" height="2.5" fill="currentColor"/></svg>',
  'Paused':'<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M4 2.5v7M8 2.5v7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
};
function statusTag(id){
  var w=statusWord(id),cls=w==='In Routine'?'now':(w==='Low'||w==='Paused'||w==='Finished')?'occ':'time';
  return '<span class="tchip '+cls+'">'+(STATUS_GLYPH[w]?'<span class="tglyph">'+STATUS_GLYPH[w]+'</span>':'')+w+'</span>';

/* When was a treatment product last used, per the routine record. */

  CLEANSE:'First, so every step reaches clean skin.',

/* ================================================================
   STRUCTURED ASSISTANCE
   One calm suggestion at a time, from explicit local rules over the
   person's own records. The Advisor is a boundary: a future, approved
   provider can replace LocalRulesProvider without touching any screen.
   Provider contract: suggest(ctx) -> {id,title,rationale,why,state,
   action:{label,act,id?,v?},dismissLabel} | null
   ================================================================ */
var ASSIST_STATES=['Safe To Use','Use With Caution','Do Not Combine Yet','Best For Morning','Best For Evening',
  'Travel Optional','Routine Essential','Needs More Information','Check Product Directions','Consider Professional Advice'];
var LocalRulesProvider={
  name:'Local Rules',
  generated:false,   /* nothing here is generated by AI */
  suggest:function(ctx){
    var ids=ctx.products,P=PRODUCTS;
    /* 1. a product is running low */
    var low=ids.filter(function(id){return P[id].status==='NEARLY_EMPTY'&&ctx.replenish.indexOf(id)<0})[0];
    if(low){
      var lp=P[low];
      return {id:'low:'+low,title:lp.productName+' Is Running Low',
        rationale:'Add It To Replenish List?',
        why:'Because '+lp.brand+' '+lp.productName+' is marked Low in your Cabinet.',
        state:'Routine Essential',
        action:{label:'Add To Replenish List',act:'replenish-add',id:low},dismissLabel:'Not Now'};
    }
    /* 1b. the air outside, when a location is set */
    var air=WEATHER.air();
    if(air==='dry'&&ids.length)return {id:'air:dry:'+stamp(now()),title:'Dry Air Today',
      rationale:Math.round(S.weather.humidity)+'% humidity in '+S.weather.place+'.',
      why:'Because the air is dry where you are. A hydrating step may feel better. General guidance, not medical advice.',
      state:'Best For Evening',
      action:{label:'See Your Routine',act:'tab',v:'routine'},dismissLabel:'Not Now'};
    if(air==='humid'&&ids.length)return {id:'air:humid:'+stamp(now()),title:'Humid Today',
      rationale:Math.round(S.weather.humidity)+'% humidity in '+S.weather.place+'.',
      why:'Because the air is humid where you are. Lighter textures may feel better. General guidance, not medical advice.',
      state:'Best For Morning',
      action:{label:'See Your Routine',act:'tab',v:'routine'},dismissLabel:'Not Now'};
    /* 2. the morning routine has no sun protection step */
    if(ids.length){
      var am=ctx.morning,hasProtect=am.some(function(id){return P[id].category==='PROTECT'});
      if(!hasProtect)return {id:'protect:am',title:'Your Morning Routine Has No Sun Protection Step',
        rationale:'Review Your Routine?',
        why:'Because none of the steps in your morning routine is in the Protect group. Sunscreen directions come from the product label.',
        state:'Check Product Directions',
        action:{label:'Review Your Routine',act:'advisor-review-am'},dismissLabel:'Not Now'};
    }
    /* 3. nothing usable yet */
    var usable=ids.filter(function(id){return ELIGIBLE_LIFE[P[id].status]});
    if(!usable.length)return {id:'empty',title:'Add A Product To Start Building Your Routine',
      rationale:ids.length?'Everything in your Cabinet is paused or finished.':'Your Cabinet is empty.',
      why:ids.length?'Because no product in your Cabinet is currently in use.':'Because your Cabinet has no products yet.',
      state:'Needs More Information',
      action:{label:'Add Product',act:'go-add-search'},dismissLabel:'Not Now'};
    return null;
  }
};
/* ================================================================
   WEATHER
   A place, and the air there. Off until Morgan approves the source.
   Provider: Open-Meteo (free, no key). Nothing is sent but a city name
   and coordinates; nothing is stored beyond the last reading.
   ================================================================ */
var WEATHER={
  enabled:false,
  geocode:'https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name=',
  forecast:'https://api.open-meteo.com/v1/forecast?current=temperature_2m,relative_humidity_2m&temperature_unit=fahrenheit&latitude=',
  stale:3*60*60*1000,
  line:function(){
    var w=S.weather;if(!w||!w.place)return '';
    var parts=[w.place];
    if(w.humidity!=null)parts.push(Math.round(w.humidity)+'% Humidity');
    if(w.temp!=null)parts.push(Math.round(w.temp)+'°');
    return parts.join(' · ');
  },
  air:function(){
    var w=S.weather;if(!w||w.humidity==null)return null;
    if(w.humidity<35)return 'dry';if(w.humidity>70)return 'humid';return 'mild';
  },
  set:function(place){
    var self=this;
    if(!this.enabled){S.ui.weatherNote='Location is off in this build.';render();return}
    if(!place){S.ui.weatherNote='Type a city.';render();return}
    S.ui.weatherNote='Looking up '+place+'…';render();
    fetch(this.geocode+encodeURIComponent(place)).then(function(r){return r.json()}).then(function(g){
      var hit=g&&g.results&&g.results[0];
      if(!hit)throw new Error('nf');
      S.weather={place:hit.name+(hit.admin1?', '+hit.admin1:''),lat:hit.latitude,lon:hit.longitude,humidity:null,temp:null,at:0};
      return self.refresh(true);
    }).catch(function(){S.ui.weatherNote='No place by that name.';render()});
  },
  refresh:function(force){
    var w=S.weather,self=this;
    if(!this.enabled||!w||w.lat==null)return Promise.resolve();
    if(!force&&w.at&&Date.now()-w.at<this.stale)return Promise.resolve();
    return fetch(this.forecast+w.lat+'&longitude='+w.lon).then(function(r){return r.json()}).then(function(f){
      var c=f&&f.current;if(!c)throw new Error('nf');
      w.humidity=c.relative_humidity_2m;w.temp=c.temperature_2m;w.at=Date.now();
      S.ui.weatherNote=null;save();render();
    }).catch(function(){S.ui.weatherNote='Could not reach the weather.';render()});
  },
  clear:function(){S.weather=null;S.ui.weatherNote=null;save();render()}
};

};

    if(S.ui.dialog)h+=dialogHTML();
    return h;
  }
  var grouped={};
  ids.forEach(function(id){var k=PRODUCTS[id].category;(grouped[k]=grouped[k]||[]).push(id)});

       or use Prev / Next and the arrow keys. Tap the object to lift it. */
    h+='<div class="cab-group"><p class="t-eyebrow" id="cabgroup" aria-live="polite"></p><span class="t-caption cabcount" id="cabgroupn"></span></div>'+

       '<div class="cabrail" id="cabrail">';
  }
  ORDER.forEach(function(k){
    var list=grouped[k];if(!list||!list.length)return;
    h+='<section class="cabsection'+(view==='gallery'?' rail':'')+'"><div class="cabhead">'+
       '<h2 class="t-section-heading">'+esc(cat(k))+'</h2>'+
       '<span class="t-caption cabcount">'+list.length+(list.length===1?' Product':' Products')+'</span></div>';
    if(view==='gallery'){
      h+='<div class="gallery rail">'+list.map(cabinetCard).join('')+'</div>';
    }else{
      h+='<div class="rowlist">';
      list.forEach(function(id){
        var p=PRODUCTS[id];
        h+='<button type="button" class="rowitem" data-act="detail" data-id="'+esc(id)+'" '+
          'aria-label="'+esc(p.brand+' '+p.productName+'. '+cat(p.category)+'. '+statusWord(id)+'. '+CONF[p.confidence].label+'.')+'">'+
          '<span class="thumb">'+productVisual(id,0.36,p.confidence==='UNKNOWN')+'</span>'+
          '<span class="meta"><span class="t-caption brand">'+esc(p.brand)+'</span>'+
          '<span class="t-body nm" style="display:block">'+esc(p.productName)+'</span>'+
          '<span class="t-meta tags" style="display:block">'+esc(p.kind)+' / '+esc(CONF[p.confidence].label)+'</span>'+
          '<span class="rowchips">'+statusTag(id)+' '+timingChip(id,r)+'</span></span></button>';
      });
      h+='</div>';
    }
    h+='</section>';
  });
  if(view==='gallery'){
    var ci=Math.min(Math.max(0,S.ui.cabIndex||0),ids.length-1);
    h+='</div></div>'+
       '<div class="foot-line"><span id="cabpos">'+(ci+1)+' Of '+ids.length+'</span><span class="pn2">'+
       '<button type="button" data-act="cab-prev">Prev</button> / <button type="button" data-act="cab-next">Next</button></span></div>';
  }
  h+=footWord('Cabinet');
  if(S.ui.dialog)h+=dialogHTML();
  return h;
}

function viewProduct(id){
  var p=PRODUCTS[id],h='';
  var ov=[];
  if(S.overrides.hidden[id])ov.push('Hidden for now');
  if(S.overrides.pinned[id])ov.push('Pinned to '+(S.overrides.pinned[id]==='am'?'morning':'evening'));
  if(S.overrides.optional[id])ov.push('Marked optional');
  if(S.overrides.useAnyway[id])ov.push('Used anyway');
  if(S.overrides.removed[id])ov.push('Removed from this routine');

  h+=brandBar(S.tod==='am'?'Morning':'Tonight','routine');
  h+='<div class="page-head"><button type="button" class="t-meta linkish" data-act="detail-close">Back To Cabinet</button></div>';
  if(S.ui.newProduct===id){
    h+='<section class="notice" style="border-top:none"><p class="t-meta">New Product</p>'+
       '<p class="t-body line">Read the directions. Consider a patch test.</p></section>';
  }
  var WHEN_LABEL={am:'Morning',pm:'Evening',both:'Morning + Evening',occ:'Every So Often',none:'Not Set'};
  var inToday=resolve().steps.indexOf(id)>-1,todayWord=S.tod==='am'?'This Morning':'Tonight';
  var canAdd=!inToday&&ELIGIBLE_LIFE[p.status]&&ELIGIBLE_CONF[p.confidence];
  var cabAll=cabinetIds(),pos=cabAll.indexOf(id),prevId=pos>0?cabAll[pos-1]:null,nextId=pos>-1&&pos<cabAll.length-1?cabAll[pos+1]:null;
  h+='<p class="t-eyebrow" style="margin:var(--s8) var(--margin) 0">'+esc(cat(p.category))+(pos>-1?' · '+(pos+1)+' Of '+cabAll.length:'')+'</p>';
  h+='<div class="lifted"><button type="button" class="detailthumb" id="detailthumb-btn" data-act="zoom" data-id="'+esc(id)+'" aria-label="See it larger">'+productVisual(id,Math.min(2,200/Math.max(1,p.h)),p.confidence==='UNKNOWN')+'</button></div>';
  h+='<h1 class="t-section-heading lifted-name">'+esc(p.brand+' '+p.productName)+'</h1>';
  h+='<p class="t-caption lifted-fact">'+esc(CONF[p.confidence].label)+' · Added '+esc(monthYear(p.dateAdded))+' · '+statusWord(id)+'</p>';
  h+='<div class="thread" aria-hidden="true"></div>';
  h+='<div class="tag" role="group" aria-label="Label card">'+
     '<a class="tr" href="#step-editor" aria-label="Step: '+esc(cat(p.category))+'. Edit."><span class="k">STEP</span><span class="v">'+esc(cat(p.category))+' <span class="pen" aria-hidden="true">&#9998;</span></span></a>'+
     '<a class="tr" href="#when-editor" aria-label="Time: '+esc(WHEN_LABEL[whenKey(p)])+'. Edit."><span class="k">TIME</span><span class="v">'+esc(WHEN_LABEL[whenKey(p)])+' <span class="pen" aria-hidden="true">&#9998;</span></span></a>'+
     '<div class="tr"><span class="k">SOURCE</span><span class="v">'+esc(CONF[p.confidence].label)+'</span></div>'+
     (canAdd?'<button type="button" class="btn btn-done" data-act="routine-add" data-id="'+esc(id)+'">Add To '+todayWord+'</button>':
      inToday?'<p class="tnote t-caption">In Routine</p>':'')+'</div>';
  h+='<div class="foot-line"><span></span><span class="pn2">'+
     (prevId?'<button type="button" data-act="detail" data-id="'+esc(prevId)+'">Prev</button>':'<span class="dim">Prev</span>')+' / '+
     (nextId?'<button type="button" data-act="detail" data-id="'+esc(nextId)+'">Next</button>':'<span class="dim">Next</span>')+'</span></div>';
  h+='<div class="page stack" style="padding:var(--s32) var(--margin) var(--s16)">'+

     '<div><label class="t-meta field-label" for="pnotes" style="opacity:.7">Notes</label>'+
     '<textarea class="input t-body" id="pnotes" rows="3" placeholder="Anything worth remembering">'+
       esc(S.ui.notesDraftId===id&&S.ui.notesDraft!=null?S.ui.notesDraft:p.notes)+'</textarea>'+
     '<p style="margin-top:var(--s8)"><button type="button" class="t-body linkish" data-act="save-notes" data-id="'+esc(id)+'">Save Notes</button></p></div>'+

     '<div><p class="t-meta" style="opacity:.7">Routine Placement</p>'+
     '<p class="t-body">'+esc(placementLine(id))+'</p>'+
     '<p class="t-caption" style="opacity:.75;margin-top:4px">This is guidance, not a rule.</p>'+
     '<p class="t-meta" id="step-editor" style="margin-top:var(--s8);opacity:.7">Step</p><div class="catrow">'+
     ['CLEANSE','TREAT','SEAL','PROTECT','FINISH','UNASSIGNED'].map(function(c){
       return '<button type="button" class="t-caption" data-act="set-cat" data-id="'+esc(id)+'" data-v="'+c+'" aria-pressed="'+(p.category===c)+'">'+esc(cat(c))+'</button>'}).join('')+
     '</div><p class="t-meta" id="when-editor" style="margin-top:var(--s8);opacity:.7">When Do You Use It?</p><div class="catrow">'+
     [['am','Morning'],['pm','Evening'],['both','Both'],['occ','Every So Often']].map(function(w){
       return '<button type="button" class="t-caption" data-act="set-when" data-id="'+esc(id)+'" data-v="'+w[0]+'" aria-pressed="'+(whenKey(p)===w[0])+'">'+w[1]+'</button>'}).join('')+
     '</div><p class="t-body" style="opacity:.8;margin-top:var(--s8)">In your routines: '+esc(membership(id))+'</p></div>'+

     '<div><p class="t-meta" style="opacity:.7">Identification</p>'+
     '<p class="t-body">'+esc(CONF[p.confidence].label)+'</p>'+
     (p.confidence==='CONFIRMED'||p.confidence==='MANUAL'?'':'<p class="t-body" style="opacity:.8">'+esc(p.confidenceReason)+'</p>')+'</div>'+

     '<div><p class="t-meta" style="opacity:.7">Availability</p>'+
     '<p class="t-body">'+esc(LIFE[p.status].label)+'</p></div>'+

     '<div><p class="t-meta" style="opacity:.7">Ingredient Review</p>'+
     '<p class="t-body">Needs More Information</p>'+
     '<p class="t-caption" style="opacity:.75;margin-top:4px">None on record. The label is the source.</p></div>'+

     '<div><p class="t-meta" style="opacity:.7">How To Use</p>'+directionsHTML(p,false)+'</div>'+

     (ov.length?'<div><p class="t-meta" style="opacity:.7">Your Choices</p>'+
       ov.map(function(o){return '<p class="t-body">'+esc(o)+'</p>'}).join('')+
       '<p><button type="button" class="t-body linkish" data-act="undo-ov" data-id="'+esc(id)+'">Undo</button></p></div>':'')+
     '</div>';

  /* confidence actions */
  if(p.confidence==='UNKNOWN'||p.confidence==='INFERRED'){
    h+='<div class="page-head"><p class="t-meta">Identification</p></div><div class="rowlist">'+
      '<button type="button" class="textrow t-meta" data-act="conf" data-v="CONFIRMED" data-id="'+esc(id)+'">Confirm Product</button>'+
      '<button type="button" class="textrow t-meta" data-act="edit-name" data-id="'+esc(id)+'">Edit Details</button>'+
      '<button type="button" class="textrow t-meta" data-act="retake" data-id="'+esc(id)+'">Take A Photo</button>'+
      '<button type="button" class="textrow t-meta" data-act="keep-out" data-id="'+esc(id)+'">Keep Out Of Routines</button></div>';
  } else {
    h+='<div class="page-head"><p class="t-meta">Identification</p></div><div class="rowlist">'+
      '<button type="button" class="textrow t-meta" data-act="edit-name" data-id="'+esc(id)+'">Edit Details</button>'+
      '<button type="button" class="textrow t-meta" data-act="retake" data-id="'+esc(id)+'">Replace Photo</button></div>';
  }
  if(S.ui.editName===id){
    h+='<div class="page stack"><div><label class="t-meta field-label" for="ebrand">Brand</label>'+
       '<input class="input t-body" id="ebrand" value="'+esc(p.brand)+'"></div>'+
       '<div><label class="t-meta field-label" for="nm">Product Name</label>'+
       '<input class="input t-body" id="nm" value="'+esc(p.productName)+'"'+(S.ui.saveError?' aria-invalid="true" aria-describedby="nm-err"':'')+'></div>'+
       (S.ui.saveError?'<div id="nm-err" role="alert"><p class="t-meta">We could not save that change.</p><p class="t-body">Add a product name, then try again.</p></div>':'')+
       '<button type="button" class="btn btn-done" data-act="save-name" data-id="'+esc(id)+'">Save Product</button></div>';
  }

  /* product actions: one visible place, each reversible or confirmed */
  var inToday=resolve().steps.indexOf(id)>-1,todayWord=S.tod==='am'?'This Morning':'Tonight';
  var paused=p.status==='UNAVAILABLE',finished=(p.status==='EMPTY'||p.status==='REPLACED');
  h+='<div class="page-head"><p class="t-meta">Product Actions</p></div><div class="rowlist">'+
    (p.confidence==='UNKNOWN'?'':(inToday?'<p class="t-body textrow" style="text-decoration:none;opacity:.7">In '+todayWord+'’s Routine</p>':
      '<button type="button" class="textrow t-body" data-act="routine-add" data-id="'+esc(id)+'">Add To '+todayWord+'</button>'))+
    '<button type="button" class="textrow t-body" data-act="edit-name" data-id="'+esc(id)+'">Edit Product</button>'+
    (p.status==='ARCHIVED'?
      '<button type="button" class="textrow t-body" data-act="life" data-v="ACTIVE" data-id="'+esc(id)+'">Restore Product</button>':
      (paused?'<button type="button" class="textrow t-body" data-act="life" data-v="ACTIVE" data-id="'+esc(id)+'">Resume Product</button>':
              '<button type="button" class="textrow t-body" data-act="life" data-v="UNAVAILABLE" data-id="'+esc(id)+'">Pause Product</button>')+
      (finished?'<button type="button" class="textrow t-body" data-act="life" data-v="ACTIVE" data-id="'+esc(id)+'">Mark As In Use</button>':
                '<button type="button" class="textrow t-body" data-act="life" data-v="EMPTY" data-id="'+esc(id)+'">Mark As Finished</button>')+
      '<button type="button" class="textrow t-body" data-act="remove" data-id="'+esc(id)+'" style="color:var(--action-current)">Delete Product</button>')+
    '</div>';

  /* lifecycle actions */
  h+='<div class="rowlist"><button type="button" class="textrow t-meta" data-act="toggle" data-key="moreOv" '+
    'aria-expanded="'+(S.ui.moreOv?'true':'false')+'">'+(S.ui.moreOv?'Fewer Options':'More Options')+'</button></div>';
  if(S.ui.moreOv){
  h+='<div class="page-head"><p class="t-meta">Change Availability</p></div><div class="rowlist">';
  var acts=[['NEARLY_EMPTY','Mark Nearly Empty'],['EMPTY','Mark Empty'],['UNAVAILABLE','Mark Unavailable'],
            ['TRAVEL_ONLY','Keep For Travel'],['ACTIVE',p.status==='UNAVAILABLE'?'Mark Available':'Mark In Use'],
            ['REPLACED','Mark Replaced'],['ARCHIVED','Archive Product']];
  if(p.status==='ARCHIVED')acts=[['ACTIVE','Restore Product']];
  acts.forEach(function(a){
    if(a[0]===p.status&&a[0]!=='ACTIVE')return;
    h+='<button type="button" class="textrow t-meta" data-act="life" data-v="'+a[0]+'" data-id="'+esc(id)+'">'+a[1]+'</button>';
  });
  h+='</div>';

  /* overrides */
  h+='<div class="page-head"><p class="t-meta">Your Choices</p></div><div class="rowlist">'+
    '<button type="button" class="textrow t-meta" data-act="ov" data-v="useAnyway" data-id="'+esc(id)+'">Use It Anyway</button>'+
    '<button type="button" class="textrow t-meta" data-act="ov" data-v="hidden" data-id="'+esc(id)+'">Hide For Now</button>'+
    '<button type="button" class="textrow t-meta" data-act="pin" data-v="am" data-id="'+esc(id)+'">Keep For Mornings</button>'+
    '<button type="button" class="textrow t-meta" data-act="pin" data-v="pm" data-id="'+esc(id)+'">Keep For Evenings</button>'+
    '<button type="button" class="textrow t-meta" data-act="ov" data-v="optional" data-id="'+esc(id)+'">Mark As Optional</button>'+
    '<button type="button" class="textrow t-meta" data-act="ov" data-v="removed" data-id="'+esc(id)+'">Remove From This Routine</button>'+
    '<button type="button" class="textrow t-meta" data-act="pair" data-id="'+esc(id)+'">Keep Apart From This Step</button></div>';
  }

  /* per product history */
  h+='<div class="page-head"><p class="t-meta">Routine History</p></div>';
  if(!p.routineHistory.length){
    h+='<div class="page"><p class="t-body" style="opacity:.8">No routines recorded with this product yet.</p></div>';
  } else {
    h+='<div class="rowlist">'+p.routineHistory.slice(0,8).map(function(e){
      return '<div class="entry"><p class="t-meta">'+esc(e.date+' / '+e.tod+' / '+e.mode)+'</p>'+
             '<p class="t-body obs">'+esc(e.result==='SKIPPED'?'Step skipped.':'Step completed.')+'</p></div>';
    }).join('')+'</div>';
  }
  if(S.ui.dialog)h+=dialogHTML();
  return h;
}

/* Turns a chosen file into the product picture: downscaled when the browser
   can, kept as-is when it cannot, refused when it is too large to store. */
function attachPhoto(a,src){
  if(!src||src.indexOf('data:image')!==0){a.photoError='That photo could not be read.';render();return}
  var done=false;
  var finish=function(finalSrc,ar){
    if(done)return;done=true;
    if(finalSrc.length>400000){a.photoError='That Photo Is Too Large. Try a smaller one, or continue without it.';a.photo=null;render();return}
    a.photo={ar:ar||0.5,src:finalSrc};a.photoError=null;render();
  };
  try{
    var img=new Image();
    img.onload=function(){
      var ar=(img.naturalWidth&&img.naturalHeight)?img.naturalWidth/img.naturalHeight:0.5;
      try{
        var maxH=480,scale=Math.min(1,maxH/(img.naturalHeight||maxH));
        var c=document.createElement('canvas'),ctx=c.getContext?c.getContext('2d'):null;
        if(ctx&&scale<1){
          c.width=Math.round(img.naturalWidth*scale);c.height=Math.round(img.naturalHeight*scale);
          ctx.drawImage(img,0,0,c.width,c.height);
          finish(c.toDataURL('image/jpeg',.82),ar);return;
        }
      }catch(err){}
      finish(src,ar);
    };
    img.onerror=function(){finish(src,0.5)};
    img.src=src;
    /* Some environments never fire load for a data URI; settle anyway. */
    window.setTimeout(function(){if(S.ui.add===a)finish(src,0.5)},300);
  }catch(e){finish(src,0.5)}
}
/* The built-in list carries no photographs, and Dewy never invents
   product imagery, so each result shows the kind's quiet drawn shape —
   the same language the shelf uses for bottles without photos. */
var GLYPH_BY_CATEGORY={CLEANSE:['pump',46,140],TREAT:['dropper',34,106],SEAL:['jar',68,54],
  FINISH:['tube',40,118],PROTECT:['tube',42,132],UNASSIGNED:['dropper',32,92]};
function kindGlyph(kind,hMax,wMax){
  hMax=hMax||32;wMax=wMax||24;
  var cat=(KINDS[kind]||[])[0]||'SEAL';
  var d=GLYPH_BY_CATEGORY[cat]||GLYPH_BY_CATEGORY.SEAL;
  var W=d[1],H=d[2],panels=shapeOf(d[0],W,H);
  var s=Math.min(hMax/H,wMax/W),w=Math.max(1,Math.round(W*s)),h=Math.max(1,Math.round(H*s));
  var o='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true" focusable="false">';
  for(var i=0;i<panels.length;i++){var q=panels[i];
    o+='<rect x="'+q.x+'" y="'+q.y+'" width="'+q.w+'" height="'+q.h+'" rx="'+(q.r||0)+'" fill="'+
       (q.role==='body'?FILL.opaque:CAPT.opaque)+'" stroke="var(--dried-plum)" stroke-opacity="0.25" stroke-width="1" vector-effect="non-scaling-stroke"/>';
  }
  return o+'</svg>';
}

var QUESTIONS=[
  {q:'Can These Be Used Together?',needs:2},
  {q:'Which Moisturizer Belongs Tonight?',needs:0},
  {q:'What Can I Leave Out?',needs:0},
  {q:'Why Is This Step Here?',needs:0}
];
/* Every answer is a verdict card: a state from ASSIST_STATES, a short
   reason, the product context it rests on, how complete the information
   is, and one inspectable action. Nothing here is generated by AI. */
function completenessFor(ids){
  var parts=['Ingredient data: not available'];
  var unsure=ids.filter(function(id){return PRODUCTS[id]&&PRODUCTS[id].confidence!=='CONFIRMED'});
  parts.push(unsure.length?'Identification: '+unsure.map(function(id){return CONF[PRODUCTS[id].confidence].label}).join(', '):'Identification: confirmed');
  var noDir=ids.filter(function(id){return PRODUCTS[id]&&directionsInfo(PRODUCTS[id]).state!=='known'});
  parts.push(noDir.length?'Directions: '+noDir.length+' of '+ids.length+' unknown':'Directions: on record');
  return parts.join(' · ');
}
function answerFor(qi){
  var sel=S.ask.sel,r=resolve(),when=S.tod==='am'?'This morning':'Tonight';
  var openAct=function(id){return {label:'Open '+PRODUCTS[id].productName,act:'detail',id:id}};
  if(qi===0){
    if(sel.length<2)return {state:'Needs More Information',head:'Choose two products.',expl:'Pick two from your Cabinet to compare.',rec:'',completeness:'',action:null};
    var a=PRODUCTS[sel[0]],b=PRODUCTS[sel[1]];
    var ctx=a.brand+' '+a.productName+' and '+b.brand+' '+b.productName;
    if(a.confidence==='UNKNOWN'||b.confidence==='UNKNOWN'){
      return {state:'Needs More Information',head:'One of these products is not identified.',
              expl:'There is not enough reliable information to judge this pairing.',
              rec:'Keep them separate for now.',src:ctx,completeness:completenessFor(sel),action:openAct(a.confidence==='UNKNOWN'?sel[0]:sel[1])};
    }
    if(a.category===b.category&&a.category==='SEAL'){
      var keep=r.steps.filter(function(x){return PRODUCTS[x].category==='SEAL'})[0]||sel[0];
      return {state:'Use With Caution',head:'These serve the same purpose.',
              expl:'Both are in the Hydrate step. One can wait.',
              rec:when+': '+PRODUCTS[keep].productName+'.',src:ctx+' · based on routine role',completeness:completenessFor(sel),action:openAct(keep)};
    }
    if(a.active&&b.active){
      return {state:'Do Not Combine Yet',head:'Use them on separate nights.',
              expl:'Both are strong treatments. Based on the available product information, they may be worth separating unless a clinician has advised otherwise.',
              rec:'Tonight: '+a.productName+'.\nNext treatment night: '+b.productName+'.',src:ctx+' · based on what each product does',completeness:completenessFor(sel),action:{label:'Edit Routine',act:'advisor-edit-routine'}};
    }
    return {state:'Needs More Information',head:'No clear answer.',
            expl:'Dewy holds no ingredient data for these records, so it will not guess.',
            rec:'Keep them separate for now, and check both labels.',src:ctx,completeness:completenessFor(sel),action:openAct(sel[0])};
  }
  if(qi===1){
    var seal=r.steps.filter(function(x){return PRODUCTS[x].category==='SEAL'})[0];
    if(!seal)return {state:'Needs More Information',head:'This routine has no Hydrate step.',expl:'Add a moisturizer from your Cabinet to place one.',rec:'',completeness:'',action:{label:'Edit Routine',act:'advisor-edit-routine'}};
    return {state:'Routine Essential',head:'Use '+PRODUCTS[seal].productName+'.',
            expl:'It is the moisturizer already in this routine. Your other creams serve the same purpose.',
            rec:when+': '+PRODUCTS[seal].brand+' '+PRODUCTS[seal].productName+'.',src:'Based on your current routine',completeness:completenessFor([seal]),action:openAct(seal)};
  }
  if(qi===2){
    if(!r.aside.length)return {state:'Routine Essential',head:'Nothing to leave out.',expl:'Every product here fills a separate step.',rec:'',completeness:completenessFor(r.steps),action:{label:'Edit Routine',act:'advisor-edit-routine'}};
    var x=PRODUCTS[r.aside[0].id];
    return {state:'Use With Caution',head:'Leave out '+x.productName+' '+when.toLowerCase()+'.',
            expl:REASONS[r.aside[0].reasons[0]].text,
            rec:'It stays in your Cabinet. Nothing is removed.',src:'Reason: '+REASONS[r.aside[0].reasons[0]].short,completeness:completenessFor([r.aside[0].id]),action:openAct(r.aside[0].id)};
  }
  var first=r.steps[0];
  if(!first)return {state:'Needs More Information',head:'No steps yet.',expl:'This routine has no steps.',rec:'',completeness:'',action:{label:'Edit Routine',act:'advisor-edit-routine'}};
  var cur=S.current||first,c=PRODUCTS[cur],di=directionsInfo(c);
  return {state:di.state==='known'?(S.tod==='am'?'Best For Morning':'Best For Evening'):'Check Product Directions',
          head:cat(c.category)+' comes '+(r.steps.indexOf(cur)===0?'first.':'at step '+word(r.steps.indexOf(cur)+1)+'.'),
          expl:c.why||CATEGORY_WHY[c.category]||'This step is placed by what it does.',
          rec:di.state==='known'?'Keep the order as shown.':'Check the product label before use.',
          src:c.brand+' '+c.productName+(c.why?'':' · General Guidance · Not Medical Advice'),completeness:completenessFor([cur]),action:openAct(cur)};
}

/* A short tick when a step lands, the way setting a bottle down makes a

    for(var i=0;i<this.cards.length;i++){

    var c=this.cards[i];if(!c)return;
    c.classList.add('lift');
    var pos=el('cabpos');if(pos)pos.textContent=(i+1)+' Of '+this.cards.length;
    var sec=c.closest('.cabsection');
    var secs=this.rail.querySelectorAll('.cabsection');

    var g=el('cabgroup'),gn=el('cabgroupn');
    if(g&&sec){var h2=sec.querySelector('h2'),ct=sec.querySelector('.cabcount');g.textContent=h2?h2.textContent:'';if(gn)gn.textContent=ct?ct.textContent:''}
    if(!quiet){tick(6);var nm=c.querySelector('.gname');if(nm)say((nm.textContent||'')+'. '+(i+1)+' of '+this.cards.length+'.')}
  },
  tick:function(){
    var self=this;
    if(this.drag){this.render();this.raf=requestAnimationFrame(function(){self.tick()});return}
    if(this.target!==null){
      var dx=this.target-this.x;this.v=this.v*.7+dx*.18;this.x+=this.v;
      if(Math.abs(dx)<.3&&Math.abs(this.v)<.3){this.x=this.target;this.v=0;this.target=null;this.settle(this.idx)}
    } else {
      this.x+=this.v;this.v*=.94;
      if(this.x>this.maxX()||this.x<this.minX()||Math.abs(this.v)<1.5){
        var i=this.nearest(this.x+this.v*8);this.idx=i;S.ui.cabIndex=i;this.target=-this.offsetOf(i);
      }

  step:function(d){

  down:function(e){

    this.drag={x0:e.clientX,y0:e.clientY,xs:this.x,moved:false,axis:null,last:[e.clientX,performance.now()]};

  },
  move:function(e){

    if(!d.axis){if(Math.abs(dx)<6&&Math.abs(dy)<6)return;d.axis=Math.abs(dx)>Math.abs(dy)?'x':'y'}
    if(d.axis==='y'){this.drag=null;this.wrap.classList.remove('dragging');return}
    d.moved=true;
    var nx=d.xs+dx,mx=this.maxX(),mn=this.minX();
    if(nx>mx)nx=mx+(nx-mx)*.3;if(nx<mn)nx=mn+(nx-mn)*.3;

  },
  up:function(e){

    if(d.moved){this.swallow=true;this.v=Math.max(-60,Math.min(60,this.v*1.3));if(prefersReduced()){this.to(this.nearest(this.x),true);return}}
    else{this.v=0;if(this.cur<0)this.settle(this.nearest(this.x),true)}
    this.go();
  }
};
function mountStacks(){
  _stacks.forEach(function(s){s.destroy()});_stacks=[];
  var root=document.querySelector('.stack[data-stack="steps"]');
  if(!root)return;
  var r=resolve(),steps=r.steps,cur=S.current,peek=S.ui.peek&&steps.indexOf(S.ui.peek)>-1?S.ui.peek:null;
  var heroId=peek||cur,idx=steps.indexOf(heroId),isCur=!peek||peek===cur;
  if(idx<0)return;
  var s=TactileCardStack(root,{
    hasNext:idx<steps.length-1,hasPrev:idx>0,
    onBrowse:function(d){
      var n=idx+d;if(n<0||n>=steps.length)return;
      S.ui.peek=steps[n]===cur?null:steps[n];render();
      say((S.ui.peek?'Viewing step ':'Back on step ')+(n+1)+' of '+steps.length+', '+PRODUCTS[steps[n]].productName+'.');
      var hh=document.querySelector('.stack-hero');if(hh)hh.focus();
    },
    onSave:isCur?function(){stackCommit('COMPLETED')}:null,
    onDismiss:isCur?function(){stackCommit('SKIPPED')}:null
  });
  if(s)_stacks.push(s);
}
function stackCommit(mark){
  var id=S.current;if(!id||S.advancing)return;
  S.ui.peek=null;
  advance(mark);
  S.ui.stackUndo={id:id,mark:mark,ts:Date.now()};
  window.clearTimeout(undoT);
  undoT=window.setTimeout(function(){if(S.ui.stackUndo&&S.ui.stackUndo.id===id){S.ui.stackUndo=null;render()}},STACK_TOKENS.undoMs);
}
function moveStep(id,dir){
  var own=S.routine[S.tod];if(!own)return;
  var i=own.indexOf(id),j=i+dir;if(i<0||j<0||j>=own.length)return;
  own[i]=own[j];own[j]=id;
  render();say(PRODUCTS[id].productName+' moved to step '+(j+1)+'.');
  var b=document.querySelector('[data-act="'+(dir<0?'step-up':'step-down')+'"][data-id="'+id+'"]');
  if(b&&!b.disabled)b.focus();
}
function restart(){
  var r=resolve();
  if(S.routineState==='IN_PROGRESS'||S.routineState==='PAUSED')logRoutine(r,'ABANDONED');
  S.routineState='NOT_STARTED';S.steps={};S.current=null;S.advancing=false;S.ui.stepwhy=false;
  render();
}
/* A change that would restart an active sequence asks first. */
function guard(what,apply){
  if(S.routineState!=='IN_PROGRESS'&&S.routineState!=='PAUSED'){apply();render();return}
  ask('Routine In Progress','Changing the '+what+' will start the sequence again.','Restart','Keep Going',function(){
    logRoutine(resolve(),'ABANDONED');
    S.routineState='NOT_STARTED';S.steps={};S.current=null;
    apply();
  });
}

function findStepPartner(id){
  var r=resolve();
  var same=r.steps.filter(function(x){return x!==id&&PRODUCTS[x].category===PRODUCTS[id].category})[0];
  return same||r.steps.filter(function(x){return x!==id})[0]||null;
}

/* The object goes somewhere you can see: when a product joins the routine it
   flies to the Routine tab, and the tab answers. Never the only feedback. */
function flyToTab(src,tab){
  try{
    if(!src||prefersReduced()||!src.animate)return;
    var dst=el('nav').querySelector('[data-tab="'+tab+'"]');if(!dst)return;
    var a=src.getBoundingClientRect(),b=dst.getBoundingClientRect();
    var f=src.cloneNode(true);f.className='flyer';
    f.style.cssText='position:fixed;left:'+a.left+'px;top:'+a.top+'px;width:'+a.width+'px;height:'+a.height+'px;z-index:60;pointer-events:none;mix-blend-mode:multiply';
    document.body.appendChild(f);
    var tx=(b.left+b.width/2)-(a.left+a.width/2),ty=(b.top+b.height/2)-(a.top+a.height/2);
    var an=f.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+(tx*.5)+'px,'+(ty*.5-40)+'px) scale(.5)',opacity:1,offset:.55},{transform:'translate('+tx+'px,'+ty+'px) scale(.12)',opacity:.2}],{duration:640,easing:'cubic-bezier(.3,.8,.3,1)'});
    an.onfinish=function(){f.remove();if(dst.animate)dst.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:300,easing:'ease-out'})};
  }catch(err){}
}

    var n=a.count||0;
    if(e.key==='ArrowDown'&&n){e.preventDefault();a.active=((a.active|0)+1)%n;render();return}
    if(e.key==='ArrowUp'&&n){e.preventDefault();a.active=a.active>0?a.active-1:n-1;render();return}
    if(e.key==='Enter'){
      e.preventDefault();
      var box=el('q');if(box)a.q=box.value;
      var same=a.searched&&a.ran&&normText(a.ran)===normText(a.q||'');

        var pick=el('opt-'+(a.active>=0?a.active:0));if(pick)pick.click();
      } else {
        ACTS['add-runsearch']();

      return;
    }
    if(e.key==='Escape'){
      e.preventDefault();
      if(a.q){a.q='';a.active=-1;render();var f=el('q');if(f)f.focus()}
      else{S.ui.add={step:'method'};render()}

    if(reduced||window.sessionStorage.getItem('dewy.opened'))return;
    window.sessionStorage.setItem('dewy.opened','1');
    var o=el('opening');
    o.setAttribute('data-tod',S.tod);
    o.hidden=false;
    window.setTimeout(function(){o.classList.add('gone');
      window.setTimeout(function(){o.hidden=true},450)},900);
  }catch(e){}
})();

/* The bottles carry a little weight in the scroll: three percent, capped,
   each at a slightly different depth. Off with reduced motion. */
(function(){
  try{
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var ticking=false;
    function apply(){
      ticking=false;
      var sy=window.scrollY||0;
      var objs=document.querySelectorAll('#shelf .obj svg,#shelf .obj img');
      for(var i=0;i<objs.length;i++){
        var depth=0.5+((i%3)*0.25);
        var dy=Math.max(-8,Math.min(8,sy*0.03*depth));
        objs[i].style.transform='translateY('+dy+'px)';
      }
    }
    window.addEventListener('scroll',function(){
      if(!ticking){ticking=true;window.requestAnimationFrame(apply)}
    },{passive:true});
  }catch(e){}
})();
})();
</script>
